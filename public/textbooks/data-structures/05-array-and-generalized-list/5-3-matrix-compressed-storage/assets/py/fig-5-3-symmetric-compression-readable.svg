<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="390" viewBox="0 0 1220 390" role="img" aria-labelledby="title desc">
<title id="title">Fig. 5.3 Symmetric-matrix compressed storage</title>
<desc id="desc">The lower triangle including the main diagonal is stored row by row in a one-dimensional sequence, with each k index aligned to its matrix element.</desc>
<style>
  .canvas { fill: #fff; }
  text { fill: #161616; font-family: "Times New Roman", "STIX Two Text", serif; }
  .box { fill: #fff; stroke: #202020; stroke-width: 2.2; }
  .value { font-size: 30px; }
  .index { font-size: 25px; }
  .caption { font-size: 29px; font-weight: bold; }
  .sub { font-size: 0.62em; baseline-shift: sub; }
</style>
<rect class="canvas" width="1220" height="390"/>

<g aria-label="压缩序列">
  <rect class="box" x="60" y="105" width="125" height="70"/><text x="122.5" y="150" class="value" text-anchor="middle">a<tspan class="sub">11</tspan></text>
  <rect class="box" x="185" y="105" width="125" height="70"/><text x="247.5" y="150" class="value" text-anchor="middle">a<tspan class="sub">21</tspan></text>
  <rect class="box" x="310" y="105" width="125" height="70"/><text x="372.5" y="150" class="value" text-anchor="middle">a<tspan class="sub">22</tspan></text>
  <rect class="box" x="435" y="105" width="125" height="70"/><text x="497.5" y="150" class="value" text-anchor="middle">a<tspan class="sub">31</tspan></text>
  <rect class="box" x="560" y="105" width="180" height="70"/><text x="650" y="150" class="value" text-anchor="middle">…</text>
  <rect class="box" x="740" y="105" width="145" height="70"/><text x="812.5" y="150" class="value" text-anchor="middle">a<tspan class="sub">n1</tspan></text>
  <rect class="box" x="885" y="105" width="120" height="70"/><text x="945" y="150" class="value" text-anchor="middle">…</text>
  <rect class="box" x="1005" y="105" width="155" height="70"/><text x="1082.5" y="150" class="value" text-anchor="middle">a<tspan class="sub">nn</tspan></text>
</g>

<text x="28" y="232" class="value" text-anchor="start">k =</text>
<text x="122.5" y="232" class="index" text-anchor="middle">0</text>
<text x="247.5" y="232" class="index" text-anchor="middle">1</text>
<text x="372.5" y="232" class="index" text-anchor="middle">2</text>
<text x="497.5" y="232" class="index" text-anchor="middle">3</text>
<text x="812.5" y="232" class="index" text-anchor="middle">n(n−1)/2</text>
<text x="1082.5" y="232" class="index" text-anchor="middle">n(n+1)/2−1</text>

<text x="610" y="330" class="caption" text-anchor="middle">Fig. 5.3  Symmetric-matrix compressed storage</text>
</svg>
