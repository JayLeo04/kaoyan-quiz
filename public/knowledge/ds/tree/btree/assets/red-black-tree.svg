<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
  <title id="title">含 NIL 叶结点的红黑树</title>
  <desc id="desc">根结点 13 为黑色；红色结点为 8、17、6、22、27；黑色内部结点为 1、11、15、25；所有缺失孩子均以黑色 NIL 叶结点表示。</desc>
  <rect width="1000" height="650" rx="24" fill="#f8fafc"/>
  <g stroke="#475569" stroke-width="4" stroke-linecap="round">
    <path d="M500 92L260 135M500 92L740 135M260 195L140 250M260 195L380 250M740 195L620 250M740 195L860 250"/>
    <path d="M140 310L75 370M140 310L220 370M380 310L340 470M380 310L420 470M620 310L580 470M620 310L660 470"/>
    <path d="M860 310L800 370M860 310L920 370M220 430L190 540M220 430L250 540M800 430L770 540M800 430L830 540M920 430L890 540M920 430L950 540"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="30" font-weight="700" text-anchor="middle" dominant-baseline="central" stroke-width="4">
    <g fill="#111827" stroke="#020617" style="color:#fff"><circle cx="500" cy="62" r="42"/><circle cx="140" cy="280" r="38"/><circle cx="380" cy="280" r="38"/><circle cx="620" cy="280" r="38"/><circle cx="860" cy="280" r="38"/></g>
    <g fill="#dc2626" stroke="#991b1b"><circle cx="260" cy="165" r="38"/><circle cx="740" cy="165" r="38"/><circle cx="220" cy="400" r="38"/><circle cx="800" cy="400" r="38"/><circle cx="920" cy="400" r="38"/></g>
    <g fill="#fff" stroke="none"><text x="500" y="62">13</text><text x="260" y="165">8</text><text x="740" y="165">17</text><text x="140" y="280">1</text><text x="380" y="280">11</text><text x="620" y="280">15</text><text x="860" y="280">25</text><text x="220" y="400">6</text><text x="800" y="400">22</text><text x="920" y="400">27</text></g>
  </g>
  <g fill="#111827" font-family="ui-monospace, monospace" font-size="20" font-weight="700" text-anchor="middle">
    <g><rect x="35" y="365" width="80" height="38" rx="5"/><rect x="300" y="465" width="80" height="38" rx="5"/><rect x="380" y="465" width="80" height="38" rx="5"/><rect x="540" y="465" width="80" height="38" rx="5"/><rect x="620" y="465" width="80" height="38" rx="5"/><rect x="150" y="535" width="80" height="38" rx="5"/><rect x="210" y="535" width="80" height="38" rx="5"/><rect x="730" y="535" width="80" height="38" rx="5"/><rect x="790" y="535" width="80" height="38" rx="5"/><rect x="850" y="535" width="80" height="38" rx="5"/><rect x="910" y="535" width="80" height="38" rx="5"/></g>
    <g fill="#fff" dominant-baseline="central"><text x="75" y="384">NIL</text><text x="340" y="484">NIL</text><text x="420" y="484">NIL</text><text x="580" y="484">NIL</text><text x="660" y="484">NIL</text><text x="190" y="554">NIL</text><text x="250" y="554">NIL</text><text x="770" y="554">NIL</text><text x="830" y="554">NIL</text><text x="890" y="554">NIL</text><text x="950" y="554">NIL</text></g>
  </g>
  <g font-family="system-ui, sans-serif" font-size="18" fill="#334155"><rect x="35" y="605" width="18" height="18" rx="9" fill="#dc2626"/><text x="61" y="620">红结点</text><rect x="145" y="605" width="18" height="18" rx="9" fill="#111827"/><text x="171" y="620">黑结点（NIL 也视为黑色）</text></g>
</svg>
