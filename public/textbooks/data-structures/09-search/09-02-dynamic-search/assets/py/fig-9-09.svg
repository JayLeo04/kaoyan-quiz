<svg xmlns="http://www.w3.org/2000/svg" width="760" height="930" viewBox="0 0 760 930" role="img" aria-labelledby="title desc">
  <title id="title">图9.9：在二叉排序树中删除 p 的四种示意</title>
  <desc id="desc">四个独立状态展示删除叶结点、直接子树上移、两棵子树重接，以及用直接前驱 s 替代 p 后删除 s。箭头表示父子或指针方向。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="red-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
    <style>
      text{font-family:Arial,"Microsoft YaHei",sans-serif;fill:#1f2937}
      .title{font-size:26px;font-weight:700}
      .subtitle{font-size:20px;fill:#475569}
      .card{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}
      .head{font-size:23px;font-weight:700;fill:#0f766e}
      .note{font-size:18px;fill:#475569}
      .node{fill:#fff;stroke:#334155;stroke-width:2.5}
      .nodeText{font-size:22px;font-weight:700;text-anchor:middle;dominant-baseline:middle}
      .smallNode{fill:#fff;stroke:#334155;stroke-width:2}
      .smallText{font-size:18px;font-weight:700;text-anchor:middle;dominant-baseline:middle}
      .edge{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
      .oldEdge{stroke:#b91c1c;stroke-width:2.5;stroke-dasharray:7 5;fill:none;marker-end:url(#red-arrow)}
      .deleted{fill:#fee2e2;stroke:#b91c1c;stroke-width:2.5}
      .subtree{fill:#ecfeff;stroke:#0f766e;stroke-width:2}
      .legend{font-size:19px;fill:#475569}
    </style>
  </defs>

  <text class="title" x="24" y="38">图9.9：在二叉排序树中删除 p 的四种示意</text>
  <text class="subtitle" x="24" y="70">箭头表示父子/指针方向；红色虚线表示被删除或被替代的旧关系。</text>

  <!-- (a) leaf -->
  <g>
    <rect class="card" x="20" y="92" width="350" height="360" rx="16"/>
    <text class="head" x="42" y="127">(a) p 为叶结点</text>
    <text class="note" x="55" y="158">删除前</text>
    <text class="note" x="245" y="158">删除后</text>
    <circle class="node" cx="100" cy="205" r="27"/><text class="nodeText" x="100" y="205">f</text>
    <circle class="deleted" cx="100" cy="290" r="27"/><text class="nodeText" x="100" y="290">p</text>
    <path class="edge" d="M100 234 L100 260"/>
    <text class="note" x="100" y="336" text-anchor="middle" fill="#b91c1c">删除 p</text>
    <circle class="node" cx="285" cy="205" r="27"/><text class="nodeText" x="285" y="205">f</text>
    <rect class="subtree" x="251" y="273" width="68" height="36" rx="10"/><text class="smallText" x="285" y="291">∅</text>
    <path class="edge" d="M285 234 L285 270"/>
    <text class="note" x="195" y="405" text-anchor="middle">只修改 f 的子树指针</text>
  </g>

  <!-- (b) one child -->
  <g>
    <rect class="card" x="390" y="92" width="350" height="360" rx="16"/>
    <text class="head" x="412" y="127">(b) p 只有一个子树</text>
    <text class="note" x="412" y="157">左：f.left ← P_L；右：f.left ← P_R</text>
    <text class="note" x="410" y="184">仅左子树</text>
    <circle class="node" cx="470" cy="220" r="22"/><text class="smallText" x="470" y="220">f</text>
    <circle class="deleted" cx="470" cy="275" r="22"/><text class="smallText" x="470" y="275">p</text>
    <rect class="subtree" x="442" y="315" width="56" height="32" rx="9"/><text class="smallText" x="470" y="331">P_L</text>
    <path class="edge" d="M470 243 L470 251"/><path class="edge" d="M470 298 L470 313"/>
    <circle class="node" cx="650" cy="220" r="22"/><text class="smallText" x="650" y="220">f</text>
    <rect class="subtree" x="622" y="260" width="56" height="32" rx="9"/><text class="smallText" x="650" y="276">P_L</text>
    <path class="edge" d="M650 243 L650 258"/>
    <text class="note" x="410" y="370">仅右子树</text>
    <circle class="node" cx="470" cy="405" r="22"/><text class="smallText" x="470" y="405">f</text>
    <circle class="deleted" cx="560" cy="405" r="22"/><text class="smallText" x="560" y="405">p</text>
    <rect class="subtree" x="595" y="389" width="56" height="32" rx="9"/><text class="smallText" x="623" y="405">P_R</text>
    <path class="edge" d="M492 405 L538 405"/><path class="edge" d="M582 405 L593 405"/>
    <text class="note" x="685" y="444" text-anchor="end">子树直接上移</text>
  </g>

  <!-- (c) reconnect two children -->
  <g>
    <rect class="card" x="20" y="474" width="350" height="360" rx="16"/>
    <text class="head" x="42" y="509">(c) 两子树重接</text>
    <text class="note" x="42" y="538">p 的左、右子树分别重接</text>
    <text class="note" x="56" y="567">原关系</text><text class="note" x="238" y="567">重接后</text>
    <circle class="node" cx="100" cy="603" r="23"/><text class="smallText" x="100" y="603">f</text>
    <circle class="deleted" cx="100" cy="662" r="23"/><text class="smallText" x="100" y="662">p</text>
    <rect class="subtree" x="45" y="715" width="58" height="32" rx="9"/><text class="smallText" x="74" y="731">P_L</text>
    <rect class="subtree" x="113" y="715" width="58" height="32" rx="9"/><text class="smallText" x="142" y="731">P_R</text>
    <path class="edge" d="M100 626 L100 638"/><path class="edge" d="M100 685 L74 713"/><path class="edge" d="M100 685 L142 713"/>
    <circle class="node" cx="245" cy="603" r="23"/><text class="smallText" x="245" y="603">f</text>
    <rect class="subtree" x="216" y="655" width="58" height="32" rx="9"/><text class="smallText" x="245" y="671">P_L</text>
    <circle class="node" cx="320" cy="603" r="21"/><text class="smallText" x="320" y="603">q</text>
    <circle class="node" cx="320" cy="675" r="21"/><text class="smallText" x="320" y="675">s</text>
    <rect class="subtree" x="291" y="723" width="58" height="32" rx="9"/><text class="smallText" x="320" y="739">P_R</text>
    <path class="edge" d="M245 626 L245 653"/><path class="edge" d="M320 624 L320 652"/><path class="edge" d="M320 698 L320 721"/>
    <text class="note" x="42" y="821">保留 q→s；令 f.left←P_L、s.right←P_R</text>
  </g>

  <!-- (d) predecessor replacement -->
  <g>
    <rect class="card" x="390" y="474" width="350" height="360" rx="16"/>
    <text class="head" x="412" y="509">(d) 直接前驱 s 替代 p</text>
    <text class="note" x="412" y="538">先复制 s 的关键字，再删除 s</text>
    <text class="note" x="405" y="567">删除前</text><text class="note" x="650" y="567">重接后</text>
    <circle class="node" cx="460" cy="602" r="21"/><text class="smallText" x="460" y="602">f</text>
    <circle class="deleted" cx="460" cy="655" r="21"/><text class="smallText" x="460" y="655">p</text>
    <rect class="subtree" x="414" y="701" width="54" height="30" rx="8"/><text class="smallText" x="441" y="716">P_L</text>
    <rect class="subtree" x="478" y="701" width="54" height="30" rx="8"/><text class="smallText" x="505" y="716">P_R</text>
    <circle class="node" cx="460" cy="773" r="20"/><text class="smallText" x="460" y="773">q</text>
    <circle class="node" cx="530" cy="773" r="20"/><text class="smallText" x="530" y="773">s</text>
    <rect class="subtree" x="590" y="758" width="54" height="30" rx="8"/><text class="smallText" x="617" y="773">S_L</text>
    <path class="edge" d="M460 623 L460 634"/><path class="edge" d="M460 676 L441 699"/><path class="edge" d="M460 676 L505 699"/>
    <path class="edge" d="M480 773 L508 773"/><path class="edge" d="M550 773 L588 773"/>
    <circle class="node" cx="655" cy="602" r="21"/><text class="smallText" x="655" y="602">f</text>
    <circle class="node" cx="655" cy="655" r="21"/><text class="smallText" x="655" y="655">p←s</text>
    <rect class="subtree" x="610" y="701" width="54" height="30" rx="8"/><text class="smallText" x="637" y="716">P_L</text>
    <rect class="subtree" x="674" y="701" width="54" height="30" rx="8"/><text class="smallText" x="701" y="716">P_R</text>
    <circle class="node" cx="655" cy="773" r="20"/><text class="smallText" x="655" y="773">q</text>
    <rect class="subtree" x="688" y="758" width="46" height="30" rx="8"/><text class="smallText" x="711" y="773">S_L</text>
    <path class="edge" d="M655 623 L655 634"/><path class="edge" d="M655 676 L637 699"/><path class="edge" d="M655 676 L701 699"/><path class="edge" d="M675 773 L686 773"/>
    <text class="note" x="565" y="821" text-anchor="middle">q.right ← S_L；s 被删除</text>
  </g>

  <text class="legend" x="24" y="875">P_L、P_R、S_L 表示子树占位符；p 为待删结点，s 为直接前驱，q 为 s 的双亲。</text>
  <text class="legend" x="24" y="905">q≠p 时 q.right ← S_L；q=p 时 p.left ← S_L。</text>
</svg>
