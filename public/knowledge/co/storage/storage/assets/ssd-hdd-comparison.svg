<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 390" role="img" aria-labelledby="t d"><title id="t">SSD 与 HDD 对比</title><desc id="d">SSD 通过控制器直接访问 NAND 闪存，没有机械寻道；HDD 需要执行臂移动磁头并等待盘片旋转到目标扇区。</desc><style>text{font-family:system-ui,sans-serif;fill:#172033}.h{font-size:28px;font-weight:700}.t{font-size:18px;font-weight:650}.b{font-size:16px}.box{rx:18;stroke-width:2}</style><text x="460" y="38" text-anchor="middle" class="h">SSD 与 HDD 的访问路径</text><rect x="40" y="70" width="390" height="270" class="box" fill="#eaf6ff" stroke="#438bc5"/><rect x="490" y="70" width="390" height="270" class="box" fill="#fff3e3" stroke="#d88928"/><text x="235" y="110" text-anchor="middle" class="h">SSD</text><text x="685" y="110" text-anchor="middle" class="h">HDD</text><text x="75" y="155" class="t">控制器 → NAND 闪存</text><text x="75" y="195" class="b">• 无机械寻道与旋转等待</text><text x="75" y="230" class="b">• 随机访问延迟低</text><text x="75" y="265" class="b">• 擦写次数有限，需磨损均衡</text><text x="75" y="300" class="b">• 无机械噪声，抗震性较好</text><text x="525" y="155" class="t">磁头移动 → 盘片旋转 → 传输</text><text x="525" y="195" class="b">• 存在寻道时间与旋转延迟</text><text x="525" y="230" class="b">• 顺序传输优于随机访问</text><text x="525" y="265" class="b">• 单位容量成本通常较低</text><text x="525" y="300" class="b">• 有机械噪声且怕振动</text><text x="460" y="375" text-anchor="middle" class="b">二者都是非易失性辅助存储；性能差异首先来自物理介质与访问机制。</text></svg>
