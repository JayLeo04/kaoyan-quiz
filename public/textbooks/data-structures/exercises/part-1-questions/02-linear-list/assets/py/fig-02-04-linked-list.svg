<text x="1205.0" y="820" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="30px" font-weight="700" fill="#20212a">R</text>
<line x1="1455.0" y1="760" x2="1455.0" y2="548" stroke="#30323a" stroke-width="4" marker-end="url(#arrow)"/>
<text x="1455.0" y="820" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="30px" font-weight="700" fill="#20212a">S</text>
<text x="900.0" y="925" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24px" font-weight="400" fill="#555">L、P、Q、R、S 为题目给定的指针，箭头表示 next 链接方向</text>
</svg>
