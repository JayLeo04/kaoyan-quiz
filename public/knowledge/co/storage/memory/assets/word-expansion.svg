<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-labelledby="t d"><title id="t">字扩展</title><desc id="d">低位地址并联到四片 M 乘 N 位芯片，高位地址经过二到四译码器产生互斥片选，合成 4M 乘 N 位存储器。</desc><style>text{font-family:system-ui,sans-serif;fill:#172033}.h{font-size:25px;font-weight:700}.b{font-size:16px}.chip{fill:#eef6ff;stroke:#4b8fc9;stroke-width:2}.dec{fill:#fff3df;stroke:#d98b2b;stroke-width:2}.w{stroke:#566b84;stroke-width:2;fill:none}</style><text x="450" y="35" text-anchor="middle" class="h">字扩展：字长不变，字数扩大</text><rect x="55" y="115" width="150" height="120" rx="12" class="dec"/><text x="130" y="160" text-anchor="middle" class="b">高位地址</text><text x="130" y="190" text-anchor="middle" class="b">2→4 译码</text><g><rect x="280" y="60" width="130" height="90" rx="12" class="chip"/><rect x="480" y="60" width="130" height="90" rx="12" class="chip"/><rect x="280" y="235" width="130" height="90" rx="12" class="chip"/><rect x="480" y="235" width="130" height="90" rx="12" class="chip"/></g><g class="b"><text x="345" y="115" text-anchor="middle">M × N</text><text x="545" y="115" text-anchor="middle">M × N</text><text x="345" y="290" text-anchor="middle">M × N</text><text x="545" y="290" text-anchor="middle">M × N</text></g><path d="M205 140L280 105M205 165L480 105M205 190L280 280M205 215L480 280M650 80V310M410 105H650M610 105H650M410 280H650M610 280H650" class="w"/><text x="680" y="170" class="b">共同 N 位数据线</text><text x="680" y="210" class="b">低位地址并联</text><text x="450" y="370" text-anchor="middle" class="h">合成：4M × N bit</text></svg>
