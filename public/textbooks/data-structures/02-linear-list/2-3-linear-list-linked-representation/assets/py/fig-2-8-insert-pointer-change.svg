<svg xmlns="http://www.w3.org/2000/svg" width="820" height="320" viewBox="0 0 820 320" role="img" aria-labelledby="fig28-title fig28-desc">
  <title id="fig28-title">图 2.8 在单链表中插入结点时指针变化状况</title>
  <desc id="fig28-desc">上排为插入前的 a、b 结点和 p 指针，下排为插入后的 a、x、b 结点以及 p、s 指针。两条赋值语句分别为 s→next=p→next 和 p→next=s。</desc>
  <defs>
    <style>
      .title { font: 700 22px Arial, "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #111827; }
      .panel { font: 600 18px Arial, "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #1f2937; }
      .label { font: 400 18px Arial, "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #111827; }
      .formula { font: 400 18px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #111827; }
      .field { font: 400 10px Arial, sans-serif; fill: #374151; }
      .node { stroke: #334155; stroke-width: 1.6; }
      .arrow { fill: none; stroke: #475569; stroke-width: 2; stroke-linecap: round; }
    </style>
    <marker id="arrow28" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="820" height="320" fill="#ffffff"/>
  <text class="title" x="410" y="32" text-anchor="middle">图 2.8　在单链表中插入结点时指针变化状况</text>

  <text class="panel" x="38" y="68">(a) 插入前</text>
  <g aria-label="插入前">
    <text class="label" x="143" y="84" text-anchor="middle">p</text>
    <rect class="node" x="105" y="92" width="78" height="46" fill="#f8fafc"/>
    <rect class="node" x="183" y="92" width="32" height="46" fill="#ede9fe"/>
    <text class="label" x="144" y="120" text-anchor="middle">a</text>
    <text class="field" x="199" y="120" text-anchor="middle">next</text>

    <rect class="node" x="315" y="92" width="78" height="46" fill="#f8fafc"/>
    <rect class="node" x="393" y="92" width="32" height="46" fill="#ede9fe"/>
    <text class="label" x="354" y="120" text-anchor="middle">b</text>
    <text class="field" x="409" y="120" text-anchor="middle">next</text>
    <path class="arrow" d="M 217 115 H 308" marker-end="url(#arrow28)"/>
  </g>

  <text class="panel" x="38" y="181">(b) 插入后</text>
  <g aria-label="插入后">
    <text class="label" x="143" y="198" text-anchor="middle">p</text>
    <rect class="node" x="105" y="207" width="78" height="46" fill="#f8fafc"/>
    <rect class="node" x="183" y="207" width="32" height="46" fill="#ede9fe"/>
    <text class="label" x="144" y="235" text-anchor="middle">a</text>
    <text class="field" x="199" y="235" text-anchor="middle">next</text>

    <text class="label" x="282" y="198" text-anchor="middle">s</text>
    <rect class="node" x="245" y="207" width="78" height="46" fill="#f8fafc"/>
    <rect class="node" x="323" y="207" width="32" height="46" fill="#ede9fe"/>
    <text class="label" x="284" y="235" text-anchor="middle">x</text>
    <text class="field" x="339" y="235" text-anchor="middle">next</text>

    <rect class="node" x="385" y="207" width="78" height="46" fill="#f8fafc"/>
    <rect class="node" x="463" y="207" width="32" height="46" fill="#ede9fe"/>
    <text class="label" x="424" y="235" text-anchor="middle">b</text>
    <text class="field" x="479" y="235" text-anchor="middle">next</text>

    <path class="arrow" d="M 217 230 H 238" marker-end="url(#arrow28)"/>
    <path class="arrow" d="M 357 230 H 378" marker-end="url(#arrow28)"/>
  </g>

  <g aria-label="指针赋值语句">
    <text class="formula" x="610" y="270" text-anchor="middle">s→next = p→next</text>
    <text class="formula" x="610" y="300" text-anchor="middle">p→next = s</text>
  </g>
</svg>
