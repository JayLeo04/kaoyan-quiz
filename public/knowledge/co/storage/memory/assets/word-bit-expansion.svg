<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-labelledby="t d"><title id="t">字位扩展</title><desc id="d">每组两片芯片并行扩展字长，两组由高位地址译码选择扩展字数，四片 M 乘 N 位芯片合成 2M 乘 2N 位存储器。</desc><style>text{font-family:system-ui,sans-serif;fill:#172033}.h{font-size:25px;font-weight:700}.b{font-size:16px}.chip{fill:#eef6ff;stroke:#4b8fc9;stroke-width:2}.group{fill:none;stroke:#d98b2b;stroke-width:3;stroke-dasharray:7 5}</style><text x="450" y="35" text-anchor="middle" class="h">字位扩展：同时扩大字数与字长</text><rect x="170" y="70" width="560" height="115" rx="18" class="group"/><rect x="170" y="215" width="560" height="115" rx="18" class="group"/><g><rect x="235" y="88" width="170" height="80" rx="12" class="chip"/><rect x="495" y="88" width="170" height="80" rx="12" class="chip"/><rect x="235" y="232" width="170" height="80" rx="12" class="chip"/><rect x="495" y="232" width="170" height="80" rx="12" class="chip"/></g><g class="b"><text x="320" y="137" text-anchor="middle">M × N（低 N 位）</text><text x="580" y="137" text-anchor="middle">M × N（高 N 位）</text><text x="320" y="281" text-anchor="middle">M × N（低 N 位）</text><text x="580" y="281" text-anchor="middle">M × N（高 N 位）</text><text x="70" y="130">片选组 0</text><text x="70" y="275">片选组 1</text></g><text x="450" y="375" text-anchor="middle" class="h">两组 × 每组 2N 位 = 2M × 2N bit</text></svg>
