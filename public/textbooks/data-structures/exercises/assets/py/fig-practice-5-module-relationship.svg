<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">主程序模块与带权无向图模块的调用关系</title>
  <desc id="desc">按《数据结构题集（C语言版）》实习 5 的原书图示重绘。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="white"/>
  <style>
    .t { font-family: Microsoft YaHei, SimHei, Noto Sans CJK SC, sans-serif; fill: #111827; }
    .label { font-size: 22px; font-weight: 700; }
    .small { font-size: 17px; }
    .tiny { font-size: 14px; }
    .box { fill: #f8fafc; stroke: #1f2937; stroke-width: 2; rx: 8; ry: 8; }
    .line { fill: none; stroke: #1f2937; stroke-width: 2.3; marker-end: url(#arrow); }
  </style>
<text x="600" y="100" class="t label" text-anchor="middle">模块调用关系</text>
<rect class="box" x="360" y="170" width="480" height="120"/><text x="600.0" y="238.0" class="t label" text-anchor="middle">主程序模块</text>
<path class="line" d="M 600 290 L 600 420"/>
<rect class="box" x="310" y="450" width="580" height="120"/><text x="600.0" y="518.0" class="t label" text-anchor="middle">带权无向图模块</text>
</svg>
