    <rect class="char" x="272" y="378" width="36" height="30" rx="7"/><text class="charText" x="290" y="393">A</text>
    <rect class="char" x="272" y="513" width="36" height="30" rx="7"/><text class="charText" x="290" y="528">N</text>
    <path class="edge" d="M198 408 L270 393"/><path class="edge" d="M198 528 L270 528"/>
