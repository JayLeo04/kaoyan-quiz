    <rect class="char" x="492" y="890" width="36" height="30" rx="7"/><text class="charText" x="510" y="905">$</text>
    <path class="edge" d="M308 755 L380 755"/><path class="edge" d="M308 860 L380 860"/><path class="edge" d="M308 905 L380 905"/><path class="edge" d="M418 905 L490 905"/>
    <text class="ptr" x="426" y="761">infoptr → LAN</text><text class="ptr" x="326" y="806">infoptr → LI</text><text class="ptr" x="426" y="866">infoptr → LIU</text><text class="ptr" x="536" y="911">infoptr → LONG</text>
