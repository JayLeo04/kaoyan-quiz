  <path d="M235 92h490v52h-86v64H235z" fill="#e2e8f0" stroke="#334155" stroke-width="5"/>
  <path d="M288 121h300v58H288z" fill="#0f172a"/>
  <g fill="#fbbf24">
    <rect x="306" y="132" width="22" height="36" rx="3"/><rect x="344" y="132" width="22" height="36" rx="3"/>
    <rect x="382" y="132" width="22" height="36" rx="3"/><rect x="420" y="132" width="22" height="36" rx="3"/>
    <rect x="458" y="132" width="22" height="36" rx="3"/><rect x="496" y="132" width="22" height="36" rx="3"/>
