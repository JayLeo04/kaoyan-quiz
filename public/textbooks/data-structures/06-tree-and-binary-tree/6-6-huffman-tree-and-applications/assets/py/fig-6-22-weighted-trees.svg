<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="760" height="1760" viewBox="0 0 760 1760"
     role="img" aria-labelledby="fig622-title fig622-desc">
  <title id="fig622-title">图 6.22　具有不同带权路径长度的二叉树</title>
  <desc id="fig622-desc">三棵具有四个带权叶子 a、b、c、d 的二叉树。叶权为 a=7、b=5、c=2、d=4，并分别给出 WPL=36、WPL=46、WPL=35 的计算式。</desc>
  <style>
    .fig622-title { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 30px; font-weight: 700; fill: #182433; }
    .fig622-subtitle { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 20px; fill: #526579; }
    .fig622-panel { fill: #ffffff; stroke: #d7e0e8; stroke-width: 2; }
    .fig622-panel-title { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 25px; font-weight: 700; fill: #182433; }
    .fig622-edge { fill: none; stroke: #52677d; stroke-width: 4.5; stroke-linecap: round; }
    .fig622-internal { fill: #f2f6fa; stroke: #52677d; stroke-width: 3.5; }
    .fig622-leaf { fill: #eaf3ff; stroke: #2f6fbd; stroke-width: 3; }
    .fig622-leaf-text { font-family: "SFMono-Regular", "Roboto Mono", monospace; font-size: 21px; font-weight: 700; fill: #18324b; }
    .fig622-equation { font-family: "SFMono-Regular", "Roboto Mono", monospace; font-size: 20px; fill: #26384b; }
    .fig622-note { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 20px; fill: #c8752b; font-weight: 700; }
  </style>

  <rect width="760" height="1760" fill="#ffffff"/>
  <text class="fig622-title" x="380" y="42" text-anchor="middle">图 6.22　具有不同带权路径长度的二叉树</text>
  <text class="fig622-subtitle" x="380" y="76" text-anchor="middle">四个叶子权值：a=7，b=5，c=2，d=4　（每条分支长度为 1）</text>

  <rect class="fig622-panel" x="28" y="106" width="704" height="500" rx="16"/>
  <rect class="fig622-panel" x="28" y="630" width="704" height="520" rx="16"/>
  <rect class="fig622-panel" x="28" y="1175" width="704" height="555" rx="16"/>

  <g aria-label="树 a">
    <text class="fig622-panel-title" x="380" y="145" text-anchor="middle">(a)　WPL=36</text>
    <path class="fig622-edge" d="M 360 212 L 230 272 M 400 212 L 530 272"/>
    <path class="fig622-edge" d="M 230 328 L 155 416 M 230 328 L 305 416"/>
    <path class="fig622-edge" d="M 530 328 L 455 416 M 530 328 L 605 416"/>
    <circle class="fig622-internal" cx="380" cy="190" r="28"/>
    <circle class="fig622-internal" cx="230" cy="300" r="28"/>
    <circle class="fig622-internal" cx="530" cy="300" r="28"/>
    <rect class="fig622-leaf" x="111" y="416" width="88" height="52" rx="11"/>
    <rect class="fig622-leaf" x="261" y="416" width="88" height="52" rx="11"/>
    <rect class="fig622-leaf" x="411" y="416" width="88" height="52" rx="11"/>
    <rect class="fig622-leaf" x="561" y="416" width="88" height="52" rx="11"/>
    <text class="fig622-leaf-text" x="155" y="449" text-anchor="middle">a=7</text>
    <text class="fig622-leaf-text" x="305" y="449" text-anchor="middle">b=5</text>
    <text class="fig622-leaf-text" x="455" y="449" text-anchor="middle">c=2</text>
    <text class="fig622-leaf-text" x="605" y="449" text-anchor="middle">d=4</text>
    <text class="fig622-equation" x="380" y="540" text-anchor="middle">WPL=7×2+5×2+2×2+4×2=36</text>
    <text class="fig622-subtitle" x="380" y="575" text-anchor="middle">四个叶子深度均为 2</text>
  </g>

  <g aria-label="树 b">
    <text class="fig622-panel-title" x="380" y="669" text-anchor="middle">(b)　WPL=46</text>
    <path class="fig622-edge" d="M 356 735 L 195 784 M 404 735 L 520 782"/>
    <path class="fig622-edge" d="M 520 838 L 410 924 M 520 838 L 585 922"/>
    <path class="fig622-edge" d="M 585 978 L 530 1029 M 585 978 L 640 1029"/>
    <circle class="fig622-internal" cx="380" cy="715" r="28"/>
    <circle class="fig622-internal" cx="520" cy="810" r="28"/>
    <circle class="fig622-internal" cx="585" cy="950" r="28"/>
    <rect class="fig622-leaf" x="151" y="784" width="88" height="52" rx="11"/>
    <rect class="fig622-leaf" x="366" y="924" width="88" height="52" rx="11"/>
    <rect class="fig622-leaf" x="486" y="1029" width="88" height="52" rx="11"/>
    <rect class="fig622-leaf" x="596" y="1029" width="88" height="52" rx="11"/>
    <text class="fig622-leaf-text" x="195" y="817" text-anchor="middle">c=2</text>
    <text class="fig622-leaf-text" x="410" y="957" text-anchor="middle">d=4</text>
    <text class="fig622-leaf-text" x="530" y="1062" text-anchor="middle">a=7</text>
    <text class="fig622-leaf-text" x="640" y="1062" text-anchor="middle">b=5</text>
    <text class="fig622-equation" x="380" y="1110" text-anchor="middle">WPL=7×3+5×3+2×1+4×2=46</text>
  </g>

  <g aria-label="树 c">
    <text class="fig622-panel-title" x="380" y="1214" text-anchor="middle">(c)　WPL=35</text>
    <path class="fig622-edge" d="M 356 1280 L 195 1329 M 404 1280 L 520 1327"/>
    <path class="fig622-edge" d="M 520 1383 L 410 1469 M 520 1383 L 585 1467"/>
    <path class="fig622-edge" d="M 585 1523 L 530 1574 M 585 1523 L 640 1574"/>
    <circle class="fig622-internal" cx="380" cy="1260" r="28"/>
    <circle class="fig622-internal" cx="520" cy="1355" r="28"/>
    <circle class="fig622-internal" cx="585" cy="1495" r="28"/>
    <rect class="fig622-leaf" x="151" y="1329" width="88" height="52" rx="11"/>
    <rect class="fig622-leaf" x="366" y="1469" width="88" height="52" rx="11"/>
    <rect class="fig622-leaf" x="486" y="1574" width="88" height="52" rx="11"/>
    <rect class="fig622-leaf" x="596" y="1574" width="88" height="52" rx="11"/>
    <text class="fig622-leaf-text" x="195" y="1362" text-anchor="middle">a=7</text>
    <text class="fig622-leaf-text" x="410" y="1502" text-anchor="middle">b=5</text>
    <text class="fig622-leaf-text" x="530" y="1607" text-anchor="middle">c=2</text>
    <text class="fig622-leaf-text" x="640" y="1607" text-anchor="middle">d=4</text>
    <text class="fig622-equation" x="380" y="1660" text-anchor="middle">WPL=7×1+5×2+2×3+4×3=35</text>
    <text class="fig622-note" x="380" y="1702" text-anchor="middle">WPL 最小：哈夫曼树</text>
  </g>
</svg>
