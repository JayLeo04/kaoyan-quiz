<svg xmlns="http://www.w3.org/2000/svg" width="820" height="320" viewBox="0 0 820 320" role="img" aria-labelledby="fig212-title fig212-desc">
  <title id="fig212-title">图 2.12 单循环链表</title>
  <desc id="fig212-desc">(a) 为非空单循环链表，H 指向头结点 a_1，尾结点 a_n 的 next 指针回到头结点；(b) 为空表，H 指向空表结点，其 next 保持自环。</desc>
  <defs>
    <style>
      .title { font: 700 22px Arial, "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #111827; }
      .panel { font: 600 18px Arial, "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #1f2937; }
      .label { font: 400 17px Arial, "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #111827; }
      .field { font: 400 10px Arial, sans-serif; fill: #374151; }
      .node { stroke: #334155; stroke-width: 1.6; }
      .arrow { fill: none; stroke: #475569; stroke-width: 2; stroke-linecap: round; }
    </style>
    <marker id="arrow212" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="820" height="320" fill="#ffffff"/>
  <text class="title" x="410" y="30" text-anchor="middle">图 2.12　单循环链表</text>

  <text class="panel" x="235" y="66" text-anchor="middle">(a) 非空表</text>
  <g aria-label="非空单循环链表">
    <text class="label" x="40" y="128" text-anchor="middle">H</text>
    <path class="arrow" d="M 52 122 H 58" marker-end="url(#arrow212)"/>

    <rect class="node" x="60" y="103" width="47" height="46" fill="#f8fafc"/>
    <rect class="node" x="107" y="103" width="28" height="46" fill="#ede9fe"/>
    <text class="label" x="83.5" y="131" text-anchor="middle">a_1</text>
    <text class="field" x="121" y="129" text-anchor="middle">next</text>

    <rect class="node" x="145" y="103" width="47" height="46" fill="#f8fafc"/>
    <rect class="node" x="192" y="103" width="28" height="46" fill="#ede9fe"/>
    <text class="label" x="168.5" y="131" text-anchor="middle">a_2</text>
    <text class="field" x="206" y="129" text-anchor="middle">next</text>

    <rect class="node" x="230" y="103" width="47" height="46" fill="#f8fafc"/>
    <rect class="node" x="277" y="103" width="28" height="46" fill="#ede9fe"/>
    <text class="small" x="253.5" y="119" text-anchor="middle">a_i</text>
    <text class="label" x="253.5" y="136" text-anchor="middle">…</text>
    <text class="field" x="291" y="129" text-anchor="middle">next</text>

    <rect class="node" x="315" y="103" width="47" height="46" fill="#f8fafc"/>
    <rect class="node" x="362" y="103" width="28" height="46" fill="#ede9fe"/>
    <text class="label" x="338.5" y="131" text-anchor="middle">a_n</text>
    <text class="field" x="376" y="129" text-anchor="middle">next</text>

    <path class="arrow" d="M 137 126 H 140" marker-end="url(#arrow212)"/>
    <path class="arrow" d="M 222 126 H 225" marker-end="url(#arrow212)"/>
    <path class="arrow" d="M 307 126 H 310" marker-end="url(#arrow212)"/>
    <path class="arrow" d="M 389 103 C 414 82 414 78 83 78 C 62 78 58 90 60 103" marker-end="url(#arrow212)"/>
  </g>

  <text class="panel" x="585" y="66" text-anchor="middle">(b) 空表</text>
  <g aria-label="空单循环链表">
    <text class="label" x="525" y="128" text-anchor="middle">H</text>
    <path class="arrow" d="M 537 122 H 553" marker-end="url(#arrow212)"/>
    <rect class="node" x="560" y="103" width="58" height="46" fill="#f8fafc"/>
    <rect class="node" x="618" y="103" width="30" height="46" fill="#ede9fe"/>
    <text class="label" x="589" y="131" text-anchor="middle">NULL</text>
    <text class="field" x="633" y="129" text-anchor="middle">next</text>
    <path class="arrow" d="M 644 103 C 684 75 706 93 646 126" marker-end="url(#arrow212)"/>
    <text class="small" x="600" y="177" text-anchor="middle">空表结点的 next 自环</text>
  </g>
</svg>
