<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1270" viewBox="0 0 760 1270" role="img" aria-labelledby="title desc">
  <title id="title">图9.10：不同形态的二叉查找树</title>
  <desc id="desc">上方是由 45、24、53、12、37、93 构成的深度 3 二叉查找树，平均查找长度为 14/6；下方是按 12、24、37、45、53、93 有序插入形成的深度 6 单支树，平均查找长度为 21/6。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      text{font-family:Arial,"Microsoft YaHei",sans-serif;fill:#1f2937}
      .title{font-size:30px;font-weight:700}
      .subtitle{font-size:20px;fill:#475569}
      .panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}
      .head{font-size:24px;font-weight:700;fill:#0f766e}
      .node{fill:#fff;stroke:#334155;stroke-width:2.5}
      .nodeText{font-size:24px;font-weight:700;text-anchor:middle;dominant-baseline:middle}
      .edge{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
      .note{font-size:23px;fill:#475569}
      .formula{font-size:25px;font-weight:700;fill:#9a3412}
    </style>
  </defs>

  <text class="title" x="24" y="38">图9.10：不同形态的二叉查找树</text>
  <text class="subtitle" x="24" y="70">同样的 6 个关键字可形成不同深度；箭头表示查找树的父子方向。</text>

  <rect class="panel" x="20" y="92" width="720" height="458" rx="18"/>
  <text class="head" x="44" y="132">(a) 深度 3：较均衡的形态</text>
  <circle class="node" cx="380" cy="205" r="31"/><text class="nodeText" x="380" y="205">45</text>
  <circle class="node" cx="250" cy="305" r="31"/><text class="nodeText" x="250" y="305">24</text>
  <circle class="node" cx="510" cy="305" r="31"/><text class="nodeText" x="510" y="305">53</text>
  <circle class="node" cx="185" cy="415" r="31"/><text class="nodeText" x="185" y="415">12</text>
  <circle class="node" cx="315" cy="415" r="31"/><text class="nodeText" x="315" y="415">37</text>
  <circle class="node" cx="575" cy="415" r="31"/><text class="nodeText" x="575" y="415">93</text>
  <path class="edge" d="M358 225 L272 284"/><path class="edge" d="M402 225 L488 284"/>
  <path class="edge" d="M230 329 L199 390"/><path class="edge" d="M270 329 L302 390"/>
  <path class="edge" d="M532 329 L563 390"/>
  <text class="note" x="44" y="490">关键字序列：{45, 24, 53, 12, 37, 93}</text>
  <text class="formula" x="44" y="528">ASL₍a₎ = 1/6 [1+2+2+3+3+3] = 14/6</text>

  <rect class="panel" x="20" y="575" width="720" height="640" rx="18"/>
  <text class="head" x="44" y="615">(b) 深度 6：有序插入形成的单支树</text>
  <text class="note" x="44" y="650">关键字序列：{12, 24, 37, 45, 53, 93}</text>
  <circle class="node" cx="380" cy="705" r="31"/><text class="nodeText" x="380" y="705">12</text>
  <circle class="node" cx="380" cy="790" r="31"/><text class="nodeText" x="380" y="790">24</text>
  <circle class="node" cx="380" cy="875" r="31"/><text class="nodeText" x="380" y="875">37</text>
  <circle class="node" cx="380" cy="960" r="31"/><text class="nodeText" x="380" y="960">45</text>
  <circle class="node" cx="380" cy="1045" r="31"/><text class="nodeText" x="380" y="1045">53</text>
  <circle class="node" cx="380" cy="1130" r="31"/><text class="nodeText" x="380" y="1130">93</text>
  <path class="edge" d="M380 736 L380 759"/><path class="edge" d="M380 821 L380 844"/><path class="edge" d="M380 906 L380 929"/><path class="edge" d="M380 991 L380 1014"/><path class="edge" d="M380 1076 L380 1099"/>
  <text class="note" x="44" y="1160">最坏形态：深度 n，平均查找长度为 (n+1)/2</text>
  <text class="formula" x="44" y="1195">ASL₍b₎ = 1/6 [1+2+3+4+5+6] = 21/6</text>
</svg>
