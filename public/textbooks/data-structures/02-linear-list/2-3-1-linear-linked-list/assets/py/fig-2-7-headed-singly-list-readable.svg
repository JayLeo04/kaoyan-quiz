<svg xmlns="http://www.w3.org/2000/svg" width="780" height="300" viewBox="0 0 780 300" role="img" aria-labelledby="fig27-title fig27-desc">
  <title id="fig27-title">图 2.7 带头结点的单链表</title>
  <desc id="fig27-desc">上方为带头结点的非空单链表，下方为空表。L 指向头结点；每个结点包含数据域和 next 指针域，空表的头结点 next 指向 NULL。</desc>
  <defs>
    <style>
      .title { font: 700 22px Arial, "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #111827; }
      .panel { font: 600 18px Arial, "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #1f2937; }
      .label { font: 400 17px Arial, "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #111827; }
      .field { font: 400 10px Arial, sans-serif; fill: #374151; }
      .node { stroke: #334155; stroke-width: 1.6; }
      .arrow { fill: none; stroke: #475569; stroke-width: 2; stroke-linecap: round; }
    </style>
    <marker id="arrow27" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="780" height="300" fill="#ffffff"/>
  <text class="title" x="390" y="32" text-anchor="middle">图 2.7　带头结点的单链表</text>

  <text class="panel" x="390" y="68" text-anchor="middle">(a) 非空表</text>
  <g aria-label="非空单链表">
    <text class="label" x="40" y="121" text-anchor="middle">L</text>
    <path class="arrow" d="M 53 115 H 66" marker-end="url(#arrow27)"/>

    <rect class="node" x="70" y="92" width="75" height="44" fill="#f8fafc"/>
    <rect class="node" x="145" y="92" width="30" height="44" fill="#ede9fe"/>
    <text class="field" x="160" y="118" text-anchor="middle">next</text>

    <rect class="node" x="210" y="92" width="70" height="44" fill="#f8fafc"/>
    <rect class="node" x="280" y="92" width="30" height="44" fill="#ede9fe"/>
    <text class="field" x="295" y="118" text-anchor="middle">next</text>
    <text class="label" x="245" y="119" text-anchor="middle">a_1</text>

    <rect class="node" x="345" y="92" width="70" height="44" fill="#f8fafc"/>
    <rect class="node" x="415" y="92" width="30" height="44" fill="#ede9fe"/>
    <text class="field" x="430" y="118" text-anchor="middle">next</text>
    <text class="label" x="380" y="119" text-anchor="middle">a_2</text>

    <rect class="node" x="480" y="92" width="70" height="44" fill="#f8fafc"/>
    <rect class="node" x="550" y="92" width="30" height="44" fill="#ede9fe"/>
    <text class="field" x="565" y="118" text-anchor="middle">next</text>
    <text class="label" x="515" y="119" text-anchor="middle">…</text>
    <text class="small" x="515" y="84" text-anchor="middle">a_i</text>

    <rect class="node" x="615" y="92" width="70" height="44" fill="#f8fafc"/>
    <rect class="node" x="685" y="92" width="30" height="44" fill="#ede9fe"/>
    <text class="field" x="700" y="118" text-anchor="middle">next</text>
    <text class="label" x="650" y="119" text-anchor="middle">a_n</text>

    <path class="arrow" d="M 177 114 H 205" marker-end="url(#arrow27)"/>
    <path class="arrow" d="M 312 114 H 340" marker-end="url(#arrow27)"/>
    <path class="arrow" d="M 447 114 H 475" marker-end="url(#arrow27)"/>
    <path class="arrow" d="M 582 114 H 610" marker-end="url(#arrow27)"/>
  </g>

  <text class="panel" x="390" y="208" text-anchor="middle">(b) 空表</text>
  <g aria-label="空单链表">
    <text class="label" x="274" y="257" text-anchor="middle">L</text>
    <path class="arrow" d="M 288 251 H 307" marker-end="url(#arrow27)"/>
    <rect class="node" x="312" y="228" width="82" height="44" fill="#f8fafc"/>
    <rect class="node" x="394" y="228" width="34" height="44" fill="#ede9fe"/>
    <text class="field" x="411" y="254" text-anchor="middle">next</text>
    <path class="arrow" d="M 430 250 H 483" marker-end="url(#arrow27)"/>
    <text class="label" x="505" y="256" text-anchor="middle">NULL</text>
  </g>
</svg>
