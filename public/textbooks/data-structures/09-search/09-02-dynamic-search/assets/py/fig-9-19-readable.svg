    <rect class="char" x="382" y="393" width="36" height="30" rx="7"/><text class="charText" x="400" y="408">N</text>
    <rect class="char" x="382" y="448" width="36" height="30" rx="7"/><text class="charText" x="400" y="463">O</text>
    <path class="edge" d="M308 393 L380 363"/><path class="edge" d="M308 393 L380 408"/><path class="edge" d="M308 393 L380 463"/>
    <text class="ptr" x="426" y="369">infoptr → CHA</text>
    <rect class="char" x="452" y="393" width="36" height="30" rx="7"/><text class="charText" x="470" y="408">G</text>
