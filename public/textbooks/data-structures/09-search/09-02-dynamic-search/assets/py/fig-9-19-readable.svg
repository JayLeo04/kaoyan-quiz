    <rect class="char" x="162" y="1420" width="36" height="30" rx="7"/><text class="charText" x="180" y="1435">U</text>
    <path class="edge" d="M88 1395 L160 1365"/><path class="edge" d="M88 1395 L160 1435"/>
    <rect class="char" x="272" y="1350" width="36" height="30" rx="7"/><text class="charText" x="290" y="1365">N</text>
