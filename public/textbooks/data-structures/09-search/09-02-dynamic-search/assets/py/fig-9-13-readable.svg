<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1670" viewBox="0 0 760 1670" role="img" aria-labelledby="title desc">
  <title id="title">图9.13：LL、LR、RR、RL 平衡旋转图例</title>
  <desc id="desc">四个独立面板展示 AVL 树的 LL 右旋、RR 左旋、LR 先左旋后右旋和 RL 先右旋后左旋。每个面板保留旋转前后根结点和全部子树占位符。</desc>
  <defs>
    <marker id="turn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
    <style>
      text{font-family:Arial,"Microsoft YaHei",sans-serif;fill:#1f2937}
      .title{font-size:30px;font-weight:700}
      .subtitle{font-size:20px;fill:#475569}
      .panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}
      .head{font-size:25px;font-weight:700;fill:#0f766e}
      .case{font-size:19px;fill:#475569}
      .node{fill:#fff;stroke:#334155;stroke-width:2.5}
      .nodeText{font-size:23px;font-weight:700;text-anchor:middle;dominant-baseline:middle}
      .subtree{fill:#ecfeff;stroke:#0f766e;stroke-width:2}
      .subText{font-size:18px;font-weight:700;text-anchor:middle;dominant-baseline:middle}
      .treeLine{stroke:#334155;stroke-width:2.5;fill:none}
      .turnLine{stroke:#b45309;stroke-width:3;fill:none;marker-end:url(#turn)}
      .turnText{font-size:21px;font-weight:700;fill:#9a3412;text-anchor:middle}
      .foot{font-size:19px;fill:#475569}
    </style>
  </defs>

  <text class="title" x="24" y="38">图9.13：LL、LR、RR、RL 平衡旋转图例</text>
  <text class="subtitle" x="24" y="70">旋转前 → 旋转后；中序关键字顺序不变，新子树以 b 或 c 为根且深度保持。</text>

  <!-- LL -->
  <g>
    <rect class="panel" x="20" y="92" width="720" height="350" rx="18"/>
    <text class="head" x="44" y="128">LL：在 a 的左孩子左子树插入，单次右旋</text>
    <text class="case" x="118" y="158">旋转前</text><text class="case" x="520" y="158">旋转后</text>
    <circle class="node" cx="150" cy="205" r="26"/><text class="nodeText" x="150" y="205">A</text>
    <circle class="node" cx="105" cy="270" r="26"/><text class="nodeText" x="105" y="270">B</text>
    <rect class="subtree" x="184" y="252" width="52" height="34" rx="9"/><text class="subText" x="210" y="269">AR</text>
    <rect class="subtree" x="52" y="317" width="52" height="34" rx="9"/><text class="subText" x="78" y="334">BL</text>
    <rect class="subtree" x="132" y="317" width="52" height="34" rx="9"/><text class="subText" x="158" y="334">BR</text>
    <path class="treeLine" d="M136 226 L119 248"/><path class="treeLine" d="M169 220 L194 252"/><path class="treeLine" d="M93 294 L78 317"/><path class="treeLine" d="M119 294 L158 317"/>
    <path class="turnLine" d="M300 250 C337 218 385 218 430 250"/><text class="turnText" x="365" y="213">右旋</text>
    <circle class="node" cx="550" cy="205" r="26"/><text class="nodeText" x="550" y="205">B</text>
    <rect class="subtree" x="482" y="252" width="52" height="34" rx="9"/><text class="subText" x="508" y="269">BL</text>
    <circle class="node" cx="610" cy="270" r="26"/><text class="nodeText" x="610" y="270">A</text>
    <rect class="subtree" x="570" y="317" width="52" height="34" rx="9"/><text class="subText" x="596" y="334">BR</text>
    <rect class="subtree" x="650" y="317" width="52" height="34" rx="9"/><text class="subText" x="676" y="334">AR</text>
    <path class="treeLine" d="M534 226 L508 252"/><path class="treeLine" d="M568 222 L598 244"/><path class="treeLine" d="M598 294 L596 317"/><path class="treeLine" d="M621 294 L676 317"/>
  </g>

  <!-- LR -->
  <g>
    <rect class="panel" x="20" y="460" width="720" height="380" rx="18"/>
    <text class="head" x="44" y="496">LR：先左旋，再右旋</text>
    <text class="case" x="118" y="526">旋转前</text><text class="case" x="520" y="526">旋转后</text>
    <circle class="node" cx="150" cy="575" r="26"/><text class="nodeText" x="150" y="575">A</text>
    <circle class="node" cx="102" cy="640" r="26"/><text class="nodeText" x="102" y="640">B</text>
    <rect class="subtree" x="184" y="622" width="52" height="34" rx="9"/><text class="subText" x="210" y="639">AR</text>
    <rect class="subtree" x="48" y="690" width="52" height="34" rx="9"/><text class="subText" x="74" y="707">BL</text>
    <circle class="node" cx="160" cy="705" r="26"/><text class="nodeText" x="160" y="705">C</text>
    <rect class="subtree" x="120" y="762" width="52" height="34" rx="9"/><text class="subText" x="146" y="779">CL</text>
    <rect class="subtree" x="188" y="762" width="52" height="34" rx="9"/><text class="subText" x="214" y="779">CR</text>
    <path class="treeLine" d="M136 596 L119 618"/><path class="treeLine" d="M170 593 L194 622"/><path class="treeLine" d="M86 664 L74 690"/><path class="treeLine" d="M115 663 L145 682"/><path class="treeLine" d="M153 731 L146 762"/><path class="treeLine" d="M177 731 L214 762"/>
    <path class="turnLine" d="M296 665 C328 630 380 630 430 665"/><text class="turnText" x="364" y="618">左旋 → 右旋</text>
    <circle class="node" cx="550" cy="575" r="26"/><text class="nodeText" x="550" y="575">C</text>
    <circle class="node" cx="500" cy="640" r="26"/><text class="nodeText" x="500" y="640">B</text>
    <circle class="node" cx="610" cy="640" r="26"/><text class="nodeText" x="610" y="640">A</text>
    <rect class="subtree" x="440" y="690" width="52" height="34" rx="9"/><text class="subText" x="466" y="707">BL</text>
    <rect class="subtree" x="500" y="690" width="52" height="34" rx="9"/><text class="subText" x="526" y="707">CL</text>
    <rect class="subtree" x="566" y="690" width="52" height="34" rx="9"/><text class="subText" x="592" y="707">CR</text>
    <rect class="subtree" x="632" y="690" width="52" height="34" rx="9"/><text class="subText" x="658" y="707">AR</text>
    <path class="treeLine" d="M534 596 L511 618"/><path class="treeLine" d="M567 596 L593 618"/><path class="treeLine" d="M480 664 L466 690"/><path class="treeLine" d="M519 664 L526 690"/><path class="treeLine" d="M593 664 L592 690"/><path class="treeLine" d="M625 664 L658 690"/>
  </g>

  <!-- RR -->
  <g>
    <rect class="panel" x="20" y="860" width="720" height="350" rx="18"/>
    <text class="head" x="44" y="896">RR：在 a 的右孩子右子树插入，单次左旋</text>
    <text class="case" x="118" y="926">旋转前</text><text class="case" x="520" y="926">旋转后</text>
    <circle class="node" cx="150" cy="973" r="26"/><text class="nodeText" x="150" y="973">A</text>
    <rect class="subtree" x="52" y="1020" width="52" height="34" rx="9"/><text class="subText" x="78" y="1037">AL</text>
    <circle class="node" cx="210" cy="1037" r="26"/><text class="nodeText" x="210" y="1037">B</text>
    <rect class="subtree" x="160" y="1085" width="52" height="34" rx="9"/><text class="subText" x="186" y="1102">BL</text>
    <rect class="subtree" x="228" y="1085" width="52" height="34" rx="9"/><text class="subText" x="254" y="1102">BR</text>
    <path class="treeLine" d="M132 994 L78 1020"/><path class="treeLine" d="M169 995 L194 1014"/><path class="treeLine" d="M198 1061 L186 1085"/><path class="treeLine" d="M222 1061 L254 1085"/>
    <path class="turnLine" d="M300 1018 C338 986 387 986 430 1018"/><text class="turnText" x="365" y="980">左旋</text>
    <circle class="node" cx="550" cy="973" r="26"/><text class="nodeText" x="550" y="973">B</text>
    <circle class="node" cx="500" cy="1037" r="26"/><text class="nodeText" x="500" y="1037">A</text>
    <rect class="subtree" x="452" y="1085" width="52" height="34" rx="9"/><text class="subText" x="478" y="1102">AL</text>
    <rect class="subtree" x="520" y="1085" width="52" height="34" rx="9"/><text class="subText" x="546" y="1102">BL</text>
    <rect class="subtree" x="592" y="1020" width="52" height="34" rx="9"/><text class="subText" x="618" y="1037">BR</text>
    <path class="treeLine" d="M534 994 L517 1014"/><path class="treeLine" d="M568 995 L618 1020"/><path class="treeLine" d="M486 1061 L478 1085"/><path class="treeLine" d="M514 1061 L546 1085"/>
  </g>

  <!-- RL -->
  <g>
    <rect class="panel" x="20" y="1230" width="720" height="385" rx="18"/>
    <text class="head" x="44" y="1266">RL：先右旋，再左旋</text>
    <text class="case" x="118" y="1296">旋转前</text><text class="case" x="520" y="1296">旋转后</text>
    <circle class="node" cx="150" cy="1345" r="26"/><text class="nodeText" x="150" y="1345">A</text>
    <rect class="subtree" x="52" y="1392" width="52" height="34" rx="9"/><text class="subText" x="78" y="1409">AL</text>
    <circle class="node" cx="210" cy="1409" r="26"/><text class="nodeText" x="210" y="1409">B</text>
    <circle class="node" cx="160" cy="1475" r="26"/><text class="nodeText" x="160" y="1475">C</text>
    <rect class="subtree" x="120" y="1530" width="52" height="34" rx="9"/><text class="subText" x="146" y="1547">CL</text>
    <rect class="subtree" x="188" y="1530" width="52" height="34" rx="9"/><text class="subText" x="214" y="1547">CR</text>
    <rect class="subtree" x="252" y="1392" width="52" height="34" rx="9"/><text class="subText" x="278" y="1409">BR</text>
    <path class="treeLine" d="M132 1366 L78 1392"/><path class="treeLine" d="M169 1367 L194 1386"/><path class="treeLine" d="M198 1433 L178 1454"/><path class="treeLine" d="M222 1433 L278 1392"/><path class="treeLine" d="M148 1501 L146 1530"/><path class="treeLine" d="M174 1501 L214 1530"/>
    <path class="turnLine" d="M300 1420 C337 1384 385 1384 430 1420"/><text class="turnText" x="365" y="1380">右旋 → 左旋</text>
    <circle class="node" cx="550" cy="1345" r="26"/><text class="nodeText" x="550" y="1345">C</text>
    <circle class="node" cx="500" cy="1409" r="26"/><text class="nodeText" x="500" y="1409">A</text>
    <circle class="node" cx="610" cy="1409" r="26"/><text class="nodeText" x="610" y="1409">B</text>
    <rect class="subtree" x="452" y="1457" width="52" height="34" rx="9"/><text class="subText" x="478" y="1474">AL</text>
    <rect class="subtree" x="520" y="1457" width="52" height="34" rx="9"/><text class="subText" x="546" y="1474">CL</text>
    <rect class="subtree" x="584" y="1457" width="52" height="34" rx="9"/><text class="subText" x="610" y="1474">CR</text>
    <rect class="subtree" x="652" y="1457" width="52" height="34" rx="9"/><text class="subText" x="678" y="1474">BR</text>
    <path class="treeLine" d="M534 1366 L517 1386"/><path class="treeLine" d="M568 1366 L593 1386"/><path class="treeLine" d="M486 1433 L478 1457"/><path class="treeLine" d="M514 1433 L546 1457"/><path class="treeLine" d="M594 1433 L610 1457"/><path class="treeLine" d="M626 1433 L678 1457"/>
  </g>

  <text class="foot" x="24" y="1650">原图的 A/B/C 对应正文中的 a/b/c；AL、AR、BL、BR、CL、CR 为全部子树占位符。</text>
</svg>
