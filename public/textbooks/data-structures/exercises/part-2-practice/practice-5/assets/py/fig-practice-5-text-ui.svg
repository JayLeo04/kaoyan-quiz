<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" role="img" aria-labelledby="title desc">
  <title id="title">校园导游咨询的文本式用户界面</title>
  <desc id="desc">按《数据结构题集（C语言版）》实习 5 的原书图示重绘。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="white"/>
  <style>
    .t { font-family: Microsoft YaHei, SimHei, Noto Sans CJK SC, sans-serif; fill: #111827; }
    .label { font-size: 22px; font-weight: 700; }
    .small { font-size: 17px; }
    .tiny { font-size: 14px; }
    .box { fill: #f8fafc; stroke: #1f2937; stroke-width: 2; rx: 8; ry: 8; }
    .line { fill: none; stroke: #1f2937; stroke-width: 2.3; marker-end: url(#arrow); }
  </style>
<text x="900" y="55" class="t label" text-anchor="middle">文本方式的用户界面</text>
<rect x="80" y="100" width="1640" height="780" fill="#ffffff" stroke="#111827" stroke-width="3"/>
<text x="120" y="160" class="t small" text-anchor="start">********************************************************************************************</text>
<text x="900" y="215" class="t label" text-anchor="middle">Scenic Information-s                 Visited Path-v                 Quit-q</text>
<text x="120" y="270" class="t small" text-anchor="start">********************************************************************************************</text>
<text x="140" y="420" class="t label" text-anchor="start">Operation :-</text>
<text x="120" y="740" class="t small" text-anchor="start">********************************************************************************************</text>
<text x="140" y="815" class="t label" text-anchor="start">Enter a operation code: s/S, v/V OR q/Q</text>
<text x="120" y="860" class="t small" text-anchor="start">********************************************************************************************</text>
<rect class="box" x="560" y="320" width="340" height="72"/><text x="730.0" y="364.0" class="t small" text-anchor="middle">显示各景点名称</text>
<rect class="box" x="1250" y="300" width="320" height="72"/><text x="1410.0" y="344.0" class="t small" text-anchor="middle">操作命令清单</text>
<rect class="box" x="560" y="510" width="320" height="72"/><text x="720.0" y="554.0" class="t small" text-anchor="middle">键入操作命令符</text>
<rect class="box" x="1260" y="550" width="320" height="72"/><text x="1420.0" y="594.0" class="t small" text-anchor="middle">操作提示信息</text>
<path class="line" d="M 730 320 L 505 275"/>
<path class="line" d="M 1410 300 L 1270 250"/>
<path class="line" d="M 560 546 L 400 420"/>
<path class="line" d="M 1260 586 L 1060 760"/>
</svg>
