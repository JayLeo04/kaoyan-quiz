<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-labelledby="title desc">
  <title id="title">图 12.8：主索引、柱面索引、磁道索引与柱面数据及溢出区</title>
  <desc id="desc">分层显示 ISAM 的主索引、柱面索引、三个柱面 C₁、C₂、Cₙ 的磁道索引、基本区和溢出区，并以蓝色路径标出查找关键字 21 的完整层级路径。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="searchArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Noto Serif CJK SC", "Microsoft YaHei", serif; fill: #172033; }
    .frame { fill: #f8fafc; stroke: #334155; stroke-width: 2.5; }
    .box { fill: #ffffff; stroke: #334155; stroke-width: 2; }
    .header { fill: #e8eef7; stroke: #334155; stroke-width: 2; }
    .zone { fill: #ffffff; stroke: #475569; stroke-width: 2; }
    .label { font-size: 30px; font-weight: 700; }
    .section { font-size: 25px; font-weight: 700; }
    .body { font-size: 26px; }
    .small { font-size: 22px; }
    .tiny { font-size: 20px; }
    .searchText { fill: #1d4ed8; font-weight: 700; }
    .arrow { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    .search { stroke: #1d4ed8; stroke-width: 6; fill: none; marker-end: url(#searchArrow); }
    .searchGuide { stroke: #1d4ed8; stroke-width: 3; fill: none; stroke-dasharray: 10 8; }
    .rule { stroke: #94a3b8; stroke-width: 1.5; }
  </style>

  <rect class="frame" x="20" y="20" width="1400" height="1080" rx="18"/>
  <text class="label" x="54" y="70">图 12.8　ISAM 文件结构示例</text>
  <text class="small searchText" x="820" y="100">查找路径：① 主索引 → ② 柱面索引（选 C₁）</text>
  <text class="small searchText" x="820" y="130">③ C₁ 磁道索引 → ④ C₁ 基本区按序查找 21</text>

  <!-- 顶层索引 -->
  <text class="section" x="70" y="125">主索引</text>
  <rect class="box" x="60" y="145" width="270" height="190" rx="8"/>
  <text class="small" x="82" y="181">关键字 / 指针</text>
  <line class="rule" x1="78" y1="194" x2="312" y2="194"/>
  <text class="body" x="105" y="232">620</text>
  <text class="body" x="105" y="270">1100</text>
  <text class="body" x="105" y="308">…</text>
  <text class="body" x="205" y="308">4150</text>

  <text class="section" x="410" y="125">柱面索引</text>
  <rect class="box" x="400" y="145" width="350" height="190" rx="8"/>
  <text class="small" x="422" y="181">关键字 / 指针</text>
  <line class="rule" x1="418" y1="194" x2="732" y2="194"/>
  <text class="body" x="447" y="232">164</text>
  <text class="body" x="447" y="270">330</text>
  <text class="body" x="447" y="308">…</text>
  <text class="body" x="555" y="308">810</text>
  <text class="body" x="655" y="308">…</text>
  <text class="body" x="555" y="328">4150</text>

  <path class="arrow" d="M 330 220 L 400 220"/>
  <text class="tiny" x="335" y="205">指针</text>

  <!-- 三个柱面 -->
  <g transform="translate(50 430)">
    <rect class="box" x="0" y="0" width="400" height="610" rx="10"/>
    <rect class="header" x="0" y="0" width="400" height="58" rx="10"/>
    <text class="label" x="200" y="40" text-anchor="middle">柱面 C₁</text>
    <rect class="zone" x="24" y="78" width="352" height="104" rx="6"/>
    <text class="section" x="200" y="112" text-anchor="middle">磁道索引</text>
    <text class="tiny" x="42" y="143">基本索引项：关键字 | 指针</text>
    <text class="tiny" x="42" y="169">溢出索引项：关键字 | 指针</text>
    <text class="section" x="24" y="225">基本区（顺序存储）</text>
    <rect class="zone" x="24" y="242" width="352" height="112" rx="6"/>
    <text class="body" x="42" y="286">R₁  R₂  R₄₅</text>
    <text class="body" x="42" y="326">R₄₇  R₅₀</text>
    <rect class="zone" x="24" y="388" width="352" height="128" rx="6"/>
    <text class="section" x="200" y="422" text-anchor="middle">溢出区（链表）</text>
    <text class="tiny" x="42" y="458">溢出索引项 → 首个溢出记录</text>
    <text class="tiny" x="42" y="490">首个记录 → 后继记录（指针相链）</text>
    <text class="small searchText" x="24" y="560">21：在 C₁ 基本区按序查找</text>
  </g>

  <g transform="translate(520 430)">
    <rect class="box" x="0" y="0" width="400" height="610" rx="10"/>
    <rect class="header" x="0" y="0" width="400" height="58" rx="10"/>
    <text class="label" x="200" y="40" text-anchor="middle">柱面 C₂</text>
    <rect class="zone" x="24" y="78" width="352" height="104" rx="6"/>
    <text class="section" x="200" y="112" text-anchor="middle">磁道索引</text>
    <text class="tiny" x="42" y="143">基本索引项：关键字 | 指针</text>
    <text class="tiny" x="42" y="169">溢出索引项：关键字 | 指针</text>
    <text class="section" x="24" y="225">基本区（顺序存储）</text>
    <rect class="zone" x="24" y="242" width="352" height="112" rx="6"/>
    <text class="body" x="42" y="286">R₁₈₉  …  R₂₁₅</text>
    <text class="body" x="42" y="326">…  R₃₃₀</text>
    <rect class="zone" x="24" y="388" width="352" height="128" rx="6"/>
    <text class="section" x="200" y="422" text-anchor="middle">溢出区（链表）</text>
    <text class="tiny" x="42" y="458">溢出索引项 → 首个溢出记录</text>
    <text class="tiny" x="42" y="490">首个记录 → 后继记录（指针相链）</text>
    <text class="small" x="24" y="560">基本区与溢出区分开</text>
  </g>

  <g transform="translate(990 430)">
    <rect class="box" x="0" y="0" width="400" height="610" rx="10"/>
    <rect class="header" x="0" y="0" width="400" height="58" rx="10"/>
    <text class="label" x="200" y="40" text-anchor="middle">柱面 Cₙ</text>
    <rect class="zone" x="24" y="78" width="352" height="104" rx="6"/>
    <text class="section" x="200" y="112" text-anchor="middle">磁道索引</text>
    <text class="tiny" x="42" y="143">基本索引项：关键字 | 指针</text>
    <text class="tiny" x="42" y="169">溢出索引项：关键字 | 指针</text>
    <text class="section" x="24" y="225">基本区（顺序存储）</text>
    <rect class="zone" x="24" y="242" width="352" height="112" rx="6"/>
    <text class="body" x="42" y="286">R₃₈₄₃  …</text>
    <text class="body" x="42" y="326">R₄₁₅₀</text>
    <rect class="zone" x="24" y="388" width="352" height="128" rx="6"/>
    <text class="section" x="200" y="422" text-anchor="middle">溢出区（链表）</text>
    <text class="tiny" x="42" y="458">溢出索引项 → 首个溢出记录</text>
    <text class="tiny" x="42" y="490">首个记录 → 后继记录（指针相链）</text>
    <text class="small" x="24" y="560">每个柱面均设置溢出区</text>
  </g>

  <!-- 柱面索引到三个磁道索引的全部层级指针 -->
  <path class="arrow" d="M 560 335 C 480 360, 270 370, 250 508"/>
  <path class="arrow" d="M 600 335 L 720 508"/>
  <path class="arrow" d="M 675 335 C 780 360, 1130 365, 1190 508"/>
  <text class="tiny" x="266" y="397">指针</text>
  <text class="tiny" x="710" y="405">指针</text>
  <text class="tiny" x="1080" y="397">指针</text>

  <!-- 关键字 21 的完整查找路径：主索引 → 柱面索引 → C₁ 磁道索引 → C₁ 基本区 -->
  <path class="search" d="M 220 145 C 330 92, 430 92, 505 145"/>
  <path class="search" d="M 505 330 C 430 374, 310 390, 250 508"/>
  <path class="search" d="M 360 612 C 382 642, 378 680, 320 705"/>
</svg>
