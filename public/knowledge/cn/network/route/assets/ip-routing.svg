<svg xmlns="http://www.w3.org/2000/svg" width="980" height="300" viewBox="0 0 980 300" role="img" aria-labelledby="title desc">
  <title id="title">R1 经 R2 到达目的网络的路由示意</title>
  <desc id="desc">PC-1 位于 192.168.1.0/24，经 R1、R2 到达 PC-2 所在的 10.1.1.0/24。R3 是 R2 的另一邻居，只有学习到对应路由后才能转发到 R2。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="980" height="300" rx="24" fill="#f8fafc"/>
  <g font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="middle">
    <rect x="28" y="90" width="176" height="118" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="116" y="125" font-size="21" font-weight="700" fill="#1e3a8a">PC-1</text>
    <text x="116" y="154" font-size="15" fill="#334155">192.168.1.5</text>
    <text x="116" y="181" font-size="14" fill="#475569">192.168.1.0/24</text>

    <g fill="#ede9fe" stroke="#7c3aed" stroke-width="2">
      <rect x="266" y="102" width="120" height="92" rx="18"/>
      <rect x="446" y="102" width="120" height="92" rx="18"/>
      <rect x="446" y="218" width="120" height="62" rx="18"/>
    </g>
    <text x="326" y="142" font-size="22" font-weight="700" fill="#4c1d95">R1</text>
    <text x="326" y="169" font-size="14" fill="#5b21b6">查目的前缀</text>
    <text x="506" y="142" font-size="22" font-weight="700" fill="#4c1d95">R2</text>
    <text x="506" y="169" font-size="14" fill="#5b21b6">直连目的网</text>
    <text x="506" y="257" font-size="20" font-weight="700" fill="#4c1d95">R3</text>

    <rect x="690" y="90" width="260" height="118" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="820" y="125" font-size="21" font-weight="700" fill="#14532d">PC-2</text>
    <text x="820" y="154" font-size="15" fill="#334155">10.1.1.5</text>
    <text x="820" y="181" font-size="14" fill="#475569">10.1.1.0/24</text>

    <g stroke="#2563eb" stroke-width="5" fill="none" marker-end="url(#arrow)">
      <path d="M204 149H260"/>
      <path d="M386 149H440"/>
      <path d="M566 149H684"/>
    </g>
    <path d="M506 218V200" stroke="#64748b" stroke-width="3" stroke-dasharray="7 6"/>
    <text x="416" y="62" font-size="17" font-weight="650" fill="#1d4ed8">目的 10.1.1.5：R1 的下一跳是 R2</text>
    <text x="624" y="244" font-size="14" text-anchor="start" fill="#475569">R3 也需静态配置或动态学习该前缀</text>
  </g>
</svg>
