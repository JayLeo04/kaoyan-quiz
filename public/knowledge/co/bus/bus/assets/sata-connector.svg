  </g>
  <path d="M648 214l-28-36" stroke="#475569" stroke-width="3"/>
  <text x="680" y="240" font-family="system-ui,sans-serif" font-size="20" fill="#475569">L 形防呆键位</text>
  <text x="420" y="245" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" fill="#475569">7 针数据触点</text>
