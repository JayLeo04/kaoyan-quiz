<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1780" viewBox="0 0 760 1780" role="img" aria-labelledby="title desc">
  <title id="title">图9.19：表示关键字集(9-24)的键树</title>
  <desc id="desc">根有 C、L、W、Y、Z 五棵子树。每个关键字按字符逐层展开，以 $ 表示字符串结束，并由 infoptr 指向相应记录。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      text{font-family:Arial,"Microsoft YaHei",sans-serif;fill:#1f2937}
      .title{font-size:30px;font-weight:700}
      .subtitle{font-size:20px;fill:#475569}
      .root{fill:#fff7ed;stroke:#b45309;stroke-width:2.5}
      .group{fill:#ecfeff;stroke:#0f766e;stroke-width:2.5}
      .panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}
      .head{font-size:22px;font-weight:700;fill:#0f766e}
      .keys{font-size:17px;fill:#475569}
      .char{fill:#fff;stroke:#334155;stroke-width:2}
      .charText{font-size:20px;font-weight:700;text-anchor:middle;dominant-baseline:middle}
      .edge{stroke:#334155;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
      .ptr{font-size:17px;fill:#9a3412}
      .foot{font-size:19px;fill:#475569}
    </style>
  </defs>

  <text class="title" x="24" y="34">图9.19：表示关键字集(9-24)的键树</text>
  <text class="subtitle" x="24" y="62">根到叶路径组成关键字；$ 是字符串结束符，叶结点的 infoptr 指向记录。</text>

  <!-- root and the five ordered first-character subtrees -->
  <rect class="root" x="350" y="78" width="60" height="34" rx="9"/><text class="charText" x="380" y="95">root</text>
  <rect class="group" x="40" y="126" width="60" height="34" rx="9"/><text class="charText" x="70" y="143">C</text>
  <rect class="group" x="180" y="126" width="60" height="34" rx="9"/><text class="charText" x="210" y="143">L</text>
  <rect class="group" x="320" y="126" width="60" height="34" rx="9"/><text class="charText" x="350" y="143">W</text>
  <rect class="group" x="460" y="126" width="60" height="34" rx="9"/><text class="charText" x="490" y="143">Y</text>
  <rect class="group" x="600" y="126" width="60" height="34" rx="9"/><text class="charText" x="630" y="143">Z</text>
  <path class="edge" d="M360 112 L70 124"/><path class="edge" d="M372 112 L210 124"/><path class="edge" d="M380 112 L350 124"/><path class="edge" d="M388 112 L490 124"/><path class="edge" d="M400 112 L630 124"/>

