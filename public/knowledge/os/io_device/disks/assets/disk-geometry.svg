<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" role="img" aria-labelledby="title desc">
  <title id="title">磁盘的盘面、磁道、扇区与柱面</title>
  <desc id="desc">左侧从上方展示一个盘面的同心磁道和扇区；右侧展示多张盘片上同一半径的磁道组成柱面，以及读写磁头的位置。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5L0 9Z" fill="#334155"/></marker>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e0f2fe"/><stop offset="1" stop-color="#dbeafe"/></linearGradient>
    <style>
      .panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.label{font:600 18px system-ui,-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#0f172a}.small{font:500 15px system-ui,-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#334155}.note{font:500 14px system-ui,-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#475569}.line{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)}.track{fill:none;stroke:#2563eb;stroke-width:2}.sector{stroke:#60a5fa;stroke-width:1.5}.head{fill:#f97316;stroke:#9a3412;stroke-width:2}
    </style>
  </defs>
  <rect width="980" height="470" rx="24" fill="#f8fafc"/>
  <text x="44" y="48" class="label" font-size="24">机械磁盘的基本几何结构</text>
  <text x="44" y="76" class="note">调度题中的“磁道号”对应下图的同心圆；读写头随磁臂沿半径方向移动。</text>

  <rect x="38" y="106" width="446" height="320" rx="18" class="panel"/>
  <text x="64" y="142" class="label">一个盘面（俯视）</text>
  <circle cx="246" cy="271" r="116" fill="url(#surface)" stroke="#1d4ed8" stroke-width="3"/>
  <circle cx="246" cy="271" r="87" class="track"/>
  <circle cx="246" cy="271" r="58" class="track"/>
  <circle cx="246" cy="271" r="16" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
  <path d="M246 155V387M130 271H362M164 189L328 353M164 353L328 189" class="sector"/>
  <path d="M303 205L378 160" class="line"/>
  <text x="304" y="149" class="small">磁道：同心圆</text>
  <path d="M297 244L408 233" class="line"/>
  <text x="316" y="219" class="small">扇区：可寻址的弧形分区</text>
  <path d="M137 351L90 382" class="line"/>
  <text x="64" y="402" class="small">中心轴</text>
  <rect x="203" y="126" width="86" height="28" rx="14" fill="#dbeafe"/>
  <text x="217" y="146" class="note">盘面</text>

  <rect x="506" y="106" width="436" height="320" rx="18" class="panel"/>
  <text x="532" y="142" class="label">多张盘片与柱面（侧视）</text>
  <g fill="url(#surface)" stroke="#1d4ed8" stroke-width="2">
    <ellipse cx="684" cy="190" rx="116" ry="26"/>
    <ellipse cx="684" cy="256" rx="116" ry="26"/>
    <ellipse cx="684" cy="322" rx="116" ry="26"/>
  </g>
  <g fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="5 4">
    <ellipse cx="684" cy="190" rx="72" ry="16"/>
    <ellipse cx="684" cy="256" rx="72" ry="16"/>
    <ellipse cx="684" cy="322" rx="72" ry="16"/>
  </g>
  <line x1="612" y1="190" x2="612" y2="322" stroke="#2563eb" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="756" y1="190" x2="756" y2="322" stroke="#2563eb" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M756 248L866 220" class="line"/>
  <text x="763" y="207" class="small">同一半径的磁道</text>
  <text x="763" y="230" class="small">组成一个柱面</text>
  <path d="M565 291L534 291" class="line"/>
  <text x="530" y="316" class="note">盘片</text>
  <path d="M834 179L870 179" class="line"/>
  <circle cx="827" cy="179" r="10" class="head"/>
  <text x="776" y="170" class="small">读写磁头</text>
  <path d="M827 179L827 336" stroke="#f97316" stroke-width="4"/>
  <text x="557" y="386" class="note">磁臂带动各盘面的磁头同步沿半径方向寻道</text>
</svg>
