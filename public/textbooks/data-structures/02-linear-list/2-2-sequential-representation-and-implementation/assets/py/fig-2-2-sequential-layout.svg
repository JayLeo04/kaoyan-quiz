<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="fig22-title fig22-desc">
  <title id="fig22-title">图 2.2 线性表的顺序存储结构示意图</title>
  <desc id="fig22-desc">存储地址、内存状态和线性表位序对应关系。连续地址 b 到 b+(maxlen−1)l 对齐于九个内存单元；a_1、a_2、a_i、a_n 和竖向省略号表示已用元素，位序为 1、2、…、n，后面的单元为空闲空间。</desc>
  <defs>
    <style>
      .title { font: 700 22px Arial, "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #111827; }
      .heading { font: 600 18px Arial, "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #1f2937; }
      .label { font: 400 17px Arial, "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #111827; }
      .small { font: 400 15px Arial, "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #374151; }
      .cell { stroke: #334155; stroke-width: 1.6; }
      .bracket { fill: none; stroke: #475569; stroke-width: 1.8; stroke-linecap: square; }
    </style>
  </defs>
  <rect width="760" height="430" fill="#ffffff"/>
  <text class="title" x="380" y="34" text-anchor="middle">图 2.2　线性表的顺序存储结构示意图</text>
  <text class="heading" x="185" y="78" text-anchor="middle">存储地址</text>
  <text class="heading" x="387" y="68" text-anchor="middle">内存状态</text>
  <text class="heading" x="635" y="62" text-anchor="middle">数据元素在线性</text>
  <text class="heading" x="635" y="84" text-anchor="middle">表中的位序</text>

  <g aria-label="连续存储单元">
    <rect class="cell" x="315" y="120" width="145" height="29" fill="#f8fafc"/>
    <rect class="cell" x="315" y="149" width="145" height="29" fill="#f8fafc"/>
    <rect class="cell" x="315" y="178" width="145" height="29" fill="#f8fafc"/>
    <rect class="cell" x="315" y="207" width="145" height="29" fill="#f8fafc"/>
    <rect class="cell" x="315" y="236" width="145" height="29" fill="#f8fafc"/>
    <rect class="cell" x="315" y="265" width="145" height="29" fill="#f8fafc"/>
    <rect class="cell" x="315" y="294" width="145" height="29" fill="#f1f5f9"/>
    <rect class="cell" x="315" y="323" width="145" height="29" fill="#f1f5f9"/>
    <rect class="cell" x="315" y="352" width="145" height="29" fill="#f1f5f9"/>
    <text class="label" x="387.5" y="140" text-anchor="middle">a_1</text>
    <text class="label" x="387.5" y="169" text-anchor="middle">a_2</text>
    <text class="label" x="387.5" y="198" text-anchor="middle">⋮</text>
    <text class="label" x="387.5" y="227" text-anchor="middle">a_i</text>
    <text class="label" x="387.5" y="256" text-anchor="middle">⋮</text>
    <text class="label" x="387.5" y="285" text-anchor="middle">a_n</text>
  </g>

  <g class="label" text-anchor="middle" aria-label="连续存储地址">
    <text x="205" y="140">b</text>
    <text x="205" y="169">b+l</text>
    <text x="205" y="198">⋮</text>
    <text x="205" y="227">b+(i−1)l</text>
    <text x="205" y="256">⋮</text>
    <text x="205" y="285">b+(n−1)l</text>
    <text x="205" y="314">b+nl</text>
    <text x="205" y="343">⋮</text>
    <text x="205" y="372">b+(maxlen−1)l</text>
  </g>

  <g class="label" text-anchor="middle" aria-label="线性表位序">
    <text x="635" y="140">1</text>
    <text x="635" y="169">2</text>
    <text x="635" y="198">⋮</text>
    <text x="635" y="227">i</text>
    <text x="635" y="256">⋮</text>
    <text x="635" y="285">n</text>
  </g>

  <g aria-label="内存状态">
    <path class="bracket" d="M 495 120 h -12 M 495 120 V 294 h -12"/>
    <text class="label" x="550" y="214">已用空间</text>
    <path class="bracket" d="M 495 294 h -12 M 495 294 V 381 h -12"/>
    <text class="label" x="550" y="344">空闲空间</text>
  </g>

  <text class="small" x="380" y="407" text-anchor="middle">LOC(a_1)=b　　LOC(a_i)=b+(i−1)l</text>
</svg>
