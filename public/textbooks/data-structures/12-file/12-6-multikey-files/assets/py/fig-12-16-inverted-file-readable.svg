<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1500" viewBox="0 0 1240 1500" role="img" aria-labelledby="title desc">
  <title id="title">图 12.16：专业、已修学分、选修课目的倒排表及各记录号序列</title>
  <desc id="desc">三张倒排表完整列出次关键字和有序物理记录号；表项之间不设指针相链，跨表可按共享物理记录号进行集合运算。</desc>
  <style>
    text { font-family: "Noto Serif CJK SC", "Microsoft YaHei", serif; fill: #172033; }
    .frame { fill: #f8fafc; stroke: #334155; stroke-width: 2.5; }
    .cell { fill: #ffffff; stroke: #334155; stroke-width: 2; }
    .head { fill: #e8eef7; stroke: #334155; stroke-width: 2; }
    .group { fill: #f1f5f9; stroke: #334155; stroke-width: 2; }
    .title { font-size: 30px; font-weight: 700; }
    .tabletitle { font-size: 28px; font-weight: 700; }
    .headtext { font-size: 23px; font-weight: 700; }
    .body { font-size: 25px; }
    .note { font-size: 24px; }
    .rule { stroke: #94a3b8; stroke-width: 1.5; }
  </style>

  <rect class="frame" x="20" y="20" width="1200" height="1460" rx="18"/>
  <text class="title" x="52" y="70">图 12.16　倒排文件索引示例</text>
  <text class="note" x="52" y="112">每个次关键字项保存该项对应的物理记录号；同一项中的记录号按顺序排列。</text>

  <!-- 专业 -->
  <g transform="translate(52 150)">
    <text class="tabletitle" x="0" y="0">（a）专业倒排表</text>
    <rect class="head" x="0" y="26" width="220" height="58"/>
    <rect class="head" x="220" y="26" width="300" height="58"/>
    <rect class="head" x="520" y="26" width="616" height="58"/>
    <text class="headtext" x="110" y="63" text-anchor="middle">倒排表</text>
    <text class="headtext" x="370" y="63" text-anchor="middle">次关键字</text>
    <text class="headtext" x="828" y="63" text-anchor="middle">物理记录号</text>
    <rect class="group" x="0" y="84" width="220" height="70"/>
    <rect class="cell" x="220" y="84" width="300" height="70"/>
    <rect class="cell" x="520" y="84" width="616" height="70"/>
    <text class="body" x="110" y="129" text-anchor="middle">专业</text>
    <text class="body" x="370" y="129" text-anchor="middle">软件</text>
    <text class="body" x="548" y="129">01，02，07，08</text>
    <rect class="group" x="0" y="154" width="220" height="70"/>
    <rect class="cell" x="220" y="154" width="300" height="70"/>
    <rect class="cell" x="520" y="154" width="616" height="70"/>
    <text class="body" x="370" y="199" text-anchor="middle">计算机</text>
    <text class="body" x="548" y="199">03，05</text>
    <rect class="group" x="0" y="224" width="220" height="70"/>
    <rect class="cell" x="220" y="224" width="300" height="70"/>
    <rect class="cell" x="520" y="224" width="616" height="70"/>
    <text class="body" x="370" y="269" text-anchor="middle">应用</text>
    <text class="body" x="548" y="269">04，06，09，10</text>
  </g>

  <!-- 已修学分 -->
  <g transform="translate(52 500)">
    <text class="tabletitle" x="0" y="0">（b）已修学分倒排表</text>
    <rect class="head" x="0" y="26" width="220" height="58"/>
    <rect class="head" x="220" y="26" width="300" height="58"/>
    <rect class="head" x="520" y="26" width="616" height="58"/>
    <text class="headtext" x="110" y="63" text-anchor="middle">倒排表</text>
    <text class="headtext" x="370" y="63" text-anchor="middle">次关键字</text>
    <text class="headtext" x="828" y="63" text-anchor="middle">物理记录号</text>
    <rect class="group" x="0" y="84" width="220" height="70"/>
    <rect class="cell" x="220" y="84" width="300" height="70"/>
    <rect class="cell" x="520" y="84" width="616" height="70"/>
    <text class="body" x="110" y="129" text-anchor="middle">已修学分</text>
    <text class="body" x="370" y="129" text-anchor="middle">350～399</text>
    <text class="body" x="548" y="129">02，05，06，07，09，10</text>
    <rect class="group" x="0" y="154" width="220" height="70"/>
    <rect class="cell" x="220" y="154" width="300" height="70"/>
    <rect class="cell" x="520" y="154" width="616" height="70"/>
    <text class="body" x="370" y="199" text-anchor="middle">400～449</text>
    <text class="body" x="548" y="199">01，03，04，08</text>
  </g>

  <!-- 选修课目 -->
  <g transform="translate(52 790)">
    <text class="tabletitle" x="0" y="0">（c）选修课目倒排表</text>
    <rect class="head" x="0" y="26" width="220" height="58"/>
    <rect class="head" x="220" y="26" width="300" height="58"/>
    <rect class="head" x="520" y="26" width="616" height="58"/>
    <text class="headtext" x="110" y="63" text-anchor="middle">倒排表</text>
    <text class="headtext" x="370" y="63" text-anchor="middle">次关键字</text>
    <text class="headtext" x="828" y="63" text-anchor="middle">物理记录号</text>
    <rect class="group" x="0" y="84" width="220" height="70"/>
    <rect class="cell" x="220" y="84" width="300" height="70"/>
    <rect class="cell" x="520" y="84" width="616" height="70"/>
    <text class="body" x="110" y="129" text-anchor="middle">选修课目</text>
    <text class="body" x="370" y="129" text-anchor="middle">甲</text>
    <text class="body" x="548" y="129">02，04，06，07，08，09，10</text>
    <rect class="group" x="0" y="154" width="220" height="70"/>
    <rect class="cell" x="220" y="154" width="300" height="70"/>
    <rect class="cell" x="520" y="154" width="616" height="70"/>
    <text class="body" x="370" y="199" text-anchor="middle">乙</text>
    <text class="body" x="548" y="199">03，05，07</text>
    <rect class="group" x="0" y="224" width="220" height="70"/>
    <rect class="cell" x="220" y="224" width="300" height="70"/>
    <rect class="cell" x="520" y="224" width="616" height="70"/>
    <text class="body" x="370" y="269" text-anchor="middle">丙</text>
    <text class="body" x="548" y="269">01，02，03，04，08</text>
    <rect class="group" x="0" y="294" width="220" height="70"/>
    <rect class="cell" x="220" y="294" width="300" height="70"/>
    <rect class="cell" x="520" y="294" width="616" height="70"/>
    <text class="body" x="370" y="339" text-anchor="middle">丁</text>
    <text class="body" x="548" y="339">01，03，05，09</text>
  </g>

  <line class="rule" x1="52" y1="1230" x2="1188" y2="1230"/>
  <text class="note" x="52" y="1280">关系：相同次关键字的记录号不设指针相链，而集中存放在对应倒排表项中。</text>
  <text class="note" x="52" y="1330">三张表共享物理记录号；对次关键字的询问可按记录号作集合运算。</text>
  <text class="note" x="52" y="1380">记录号顺序与分组均按源表保留，未截断或省略任何行。</text>
</svg>
