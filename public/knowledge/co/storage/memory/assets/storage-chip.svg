<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="t d"><title id="t">M 乘 N 位存储芯片模型</title><desc id="d">log2 M 根地址线选择 M 个存储字，N 根双向数据线传送每个字的 N 位数据，片选和读写信号控制芯片。</desc><style>text{font-family:system-ui,sans-serif;fill:#182235}.h{font-size:26px;font-weight:700}.b{font-size:18px}.w{stroke:#52677f;stroke-width:3;fill:none}</style><rect x="245" y="55" width="280" height="220" rx="18" fill="#eef6ff" stroke="#4b8fc9" stroke-width="3"/><text x="385" y="105" text-anchor="middle" class="h">存储芯片</text><text x="385" y="155" text-anchor="middle" class="h">M × N bit</text><text x="385" y="205" text-anchor="middle" class="b">M 个字，每字 N 位</text><path d="M50 120H245M50 170H245M525 130H710M525 205H710" class="w"/><text x="55" y="105" class="b">地址线 ⌈log₂M⌉</text><text x="55" y="157" class="b">CS / R/W</text><text x="555" y="115" class="b">N 位数据线</text><text x="555" y="235" class="b">D₀ … Dₙ₋₁</text></svg>
