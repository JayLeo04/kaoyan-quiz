<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="660" viewBox="0 0 1260 660" role="img" aria-labelledby="title desc">
<title id="title">Fig. 5.4 General band matrix and tridiagonal matrix</title>
<desc id="desc">A general banded region around the main diagonal and a four by four tridiagonal example, including all boundary labels.</desc>
<style>
  .canvas { fill: #fff; }
  text { fill: #161616; font-family: "Times New Roman", "STIX Two Text", serif; }
  .box { fill: #fff; stroke: #202020; stroke-width: 2.2; }
  .line { stroke: #202020; stroke-width: 2.4; fill: none; }
  .label { font-size: 30px; }
  .cell { font-size: 26px; }
  .caption { font-size: 29px; font-weight: bold; }
  .sub { font-size: 0.62em; baseline-shift: sub; }
</style>
<rect class="canvas" width="1260" height="660"/>

<text x="350" y="55" class="label" text-anchor="middle">a<tspan class="sub">ij</tspan> main diagonal</text>
<text x="930" y="55" class="label" text-anchor="middle">(b) tridiagonal matrix</text>

<!-- (a) general banded case: the ten parallel diagonal lines are retained -->
<rect class="box" x="100" y="100" width="500" height="300"/>
<line class="line" x1="30" y1="110" x2="300" y2="410"/>
<line class="line" x1="65" y1="110" x2="335" y2="410"/>
<line class="line" x1="100" y1="110" x2="370" y2="410"/>
<line class="line" x1="135" y1="110" x2="405" y2="410"/>
<line class="line" x1="170" y1="110" x2="440" y2="410"/>
<line class="line" x1="205" y1="110" x2="475" y2="410"/>
<line class="line" x1="240" y1="110" x2="510" y2="410"/>
<line class="line" x1="275" y1="110" x2="545" y2="410"/>
<line class="line" x1="310" y1="110" x2="580" y2="410"/>
<line class="line" x1="345" y1="110" x2="615" y2="410"/>
<text x="350" y="460" class="label" text-anchor="middle">(a) general case</text>
<text x="350" y="505" class="label" text-anchor="middle">m rows, n columns</text>

<!-- (b) four by four tridiagonal example -->
<g aria-label="三对角矩阵示意">
  <rect class="box" x="720" y="100" width="105" height="92"/><rect class="box" x="825" y="100" width="105" height="92"/><rect class="box" x="930" y="100" width="105" height="92"/><rect class="box" x="1035" y="100" width="105" height="92"/>
  <rect class="box" x="720" y="192" width="105" height="92"/><rect class="box" x="825" y="192" width="105" height="92"/><rect class="box" x="930" y="192" width="105" height="92"/><rect class="box" x="1035" y="192" width="105" height="92"/>
  <rect class="box" x="720" y="284" width="105" height="92"/><rect class="box" x="825" y="284" width="105" height="92"/><rect class="box" x="930" y="284" width="105" height="92"/><rect class="box" x="1035" y="284" width="105" height="92"/>
  <rect class="box" x="720" y="376" width="105" height="92"/><rect class="box" x="825" y="376" width="105" height="92"/><rect class="box" x="930" y="376" width="105" height="92"/><rect class="box" x="1035" y="376" width="105" height="92"/>
  <text x="772.5" y="157" class="cell" text-anchor="middle">a<tspan class="sub">00</tspan></text>
  <text x="877.5" y="157" class="cell" text-anchor="middle">a<tspan class="sub">01</tspan></text>
  <text x="772.5" y="249" class="cell" text-anchor="middle">a<tspan class="sub">10</tspan></text>
  <text x="877.5" y="249" class="cell" text-anchor="middle">a<tspan class="sub">11</tspan></text>
  <text x="982.5" y="249" class="cell" text-anchor="middle">a<tspan class="sub">12</tspan></text>
  <text x="877.5" y="341" class="cell" text-anchor="middle">⋱</text>
  <text x="982.5" y="433" class="cell" text-anchor="middle">a<tspan class="sub">n−1,n−2</tspan></text>
  <text x="1087.5" y="433" class="cell" text-anchor="middle">a<tspan class="sub">n−1,n−1</tspan></text>
</g>

<text x="630" y="600" class="caption" text-anchor="middle">Fig. 5.4  Nonzeros concentrated around main diagonal</text>
</svg>
