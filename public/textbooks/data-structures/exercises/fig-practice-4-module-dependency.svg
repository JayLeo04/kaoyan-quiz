<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img">
  <title>fig-practice-4-module-dependency.svg</title>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#1f2937"/>
    </marker>
    <style>
      .label { font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #111827; font-size: 20px; }
      .small { font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #111827; font-size: 16px; }
      .mono { font-family: Consolas, 'Courier New', monospace; fill: #111827; font-size: 18px; }
      .node { fill: #ffffff; stroke: #334155; stroke-width: 1.5; rx: 8; }
      .edge { stroke: #1f2937; stroke-width: 1.7; fill: none; marker-end: url(#arrow); }
      .rule { stroke: #1f2937; stroke-width: 1.6; fill: none; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <g transform="translate(-120 100) scale(2)">
  <text class="label" x="360" y="30" text-anchor="middle">模块调用关系</text>
  <rect class="node" x="235" y="55" width="250" height="58"/>
  <text class="label" x="360" y="92" text-anchor="middle">主程序模块</text>
  <line class="edge" x1="360" y1="114" x2="360" y2="156"/>
  <rect class="node" x="235" y="160" width="250" height="58"/>
  <text class="label" x="360" y="197" text-anchor="middle">广义表模块</text>
  <text class="small" x="360" y="238" text-anchor="middle">主程序调用广义表模块</text>
  </g>

</svg>
