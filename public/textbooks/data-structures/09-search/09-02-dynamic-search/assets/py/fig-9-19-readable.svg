    <text class="head" x="42" y="207">C 子树：CAI、CAO；CHA、CHANG、CHAO、CHEN</text>
    <text class="keys" x="42" y="232">同层字符有序；每个 $ 都是独立的字符串结束叶。</text>
    <rect class="char" x="52" y="368" width="36" height="30" rx="7"/><text class="charText" x="70" y="383">C</text>
    <rect class="char" x="162" y="278" width="36" height="30" rx="7"/><text class="charText" x="180" y="293">A</text>
    <rect class="char" x="162" y="393" width="36" height="30" rx="7"/><text class="charText" x="180" y="408">H</text>
    <rect class="char" x="162" y="513" width="36" height="30" rx="7"/><text class="charText" x="180" y="528">E</text>
    <path class="edge" d="M88 383 L160 293"/><path class="edge" d="M88 383 L160 408"/><path class="edge" d="M88 383 L160 528"/>
