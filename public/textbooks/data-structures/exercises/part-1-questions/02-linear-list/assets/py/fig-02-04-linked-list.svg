<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000">
<title>题 2.4 所给单链表</title>
<desc>L 指向值为 2 的首结点，P、Q、R、S 分别指向值为 5、7、3、8 的结点。</desc>
<defs>
<marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
<path d="M 0 0 L 12 6 L 0 12 z" fill="#30323a"/>
</marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="900.0" y="105" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="34px" font-weight="700" fill="#20212a">题 2.4 所给单链表</text>
<line x1="220" y1="475" x2="350" y2="475" stroke="#30323a" stroke-width="4" marker-end="url(#arrow)"/>
<text x="185" y="486" text-anchor="end" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="30px" font-weight="700" fill="#20212a">L</text>
<rect x="360" y="410" width="135" height="130" fill="#f7f7fa" stroke="#30323a" stroke-width="3"/>
<rect x="495" y="410" width="55" height="130" fill="#e9e6ff" stroke="#30323a" stroke-width="3"/>
<text x="427.5" y="492" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="34px" font-weight="400" fill="#20212a">2</text>
<line x1="554" y1="475.0" x2="596" y2="475.0" stroke="#30323a" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="610" y="410" width="135" height="130" fill="#f7f7fa" stroke="#30323a" stroke-width="3"/>
<rect x="745" y="410" width="55" height="130" fill="#e9e6ff" stroke="#30323a" stroke-width="3"/>
<text x="677.5" y="492" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="34px" font-weight="400" fill="#20212a">5</text>
<line x1="804" y1="475.0" x2="846" y2="475.0" stroke="#30323a" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="860" y="410" width="135" height="130" fill="#f7f7fa" stroke="#30323a" stroke-width="3"/>
<rect x="995" y="410" width="55" height="130" fill="#e9e6ff" stroke="#30323a" stroke-width="3"/>
<text x="927.5" y="492" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="34px" font-weight="400" fill="#20212a">7</text>
<line x1="1054" y1="475.0" x2="1096" y2="475.0" stroke="#30323a" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="1110" y="410" width="135" height="130" fill="#f7f7fa" stroke="#30323a" stroke-width="3"/>
<rect x="1245" y="410" width="55" height="130" fill="#e9e6ff" stroke="#30323a" stroke-width="3"/>
<text x="1177.5" y="492" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="34px" font-weight="400" fill="#20212a">3</text>
<line x1="1304" y1="475.0" x2="1346" y2="475.0" stroke="#30323a" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="1360" y="410" width="135" height="130" fill="#f7f7fa" stroke="#30323a" stroke-width="3"/>
<rect x="1495" y="410" width="55" height="130" fill="#e9e6ff" stroke="#30323a" stroke-width="3"/>
<text x="1427.5" y="492" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="34px" font-weight="400" fill="#20212a">8</text>
<line x1="1554" y1="475.0" x2="1645" y2="475" stroke="#30323a" stroke-width="4" marker-end="url(#arrow)"/>
<text x="1700" y="486" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="42px" font-weight="400" fill="#20212a">…</text>
<line x1="705.0" y1="760" x2="705.0" y2="548" stroke="#30323a" stroke-width="4" marker-end="url(#arrow)"/>
<text x="705.0" y="820" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="30px" font-weight="700" fill="#20212a">P</text>
<line x1="955.0" y1="760" x2="955.0" y2="548" stroke="#30323a" stroke-width="4" marker-end="url(#arrow)"/>
<text x="955.0" y="820" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="30px" font-weight="700" fill="#20212a">Q</text>
