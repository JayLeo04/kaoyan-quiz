<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="fig213-title fig213-desc">
  <title id="fig213-title">图 2.13 仅设尾指针的循环链表</title>
  <desc id="fig213-desc">(a) 为仅设尾指针 A、B 的两个循环链表；(b) 为合并后的顺序 A_1…A_nB_1…B_m。合并只改变两条尾指针连接，最右端完整可见。</desc>
  <defs>
    <style>
      .title { font: 700 22px Arial, "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #111827; }
      .panel { font: 600 17px Arial, "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #1f2937; }
      .label { font: 400 16px Arial, "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #111827; }
      .small { font: 400 14px Arial, "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #374151; }
      .field { font: 400 9px Arial, sans-serif; fill: #374151; }
      .node { stroke: #334155; stroke-width: 1.5; }
      .arrow { fill: none; stroke: #475569; stroke-width: 1.9; stroke-linecap: round; }
      .reconnect { fill: none; stroke: #7c3aed; stroke-width: 1.7; stroke-dasharray: 5 4; stroke-linecap: round; }
      .bracket { fill: none; stroke: #475569; stroke-width: 1.8; }
    </style>
    <marker id="arrow213" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="reconnect213" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect width="760" height="330" fill="#ffffff"/>
  <text class="title" x="380" y="30" text-anchor="middle">图 2.13　仅设尾指针的循环链表</text>

  <text class="panel" x="245" y="59" text-anchor="middle">(a) 两个链表</text>
  <text class="small" x="640" y="59" text-anchor="middle">A、B 为尾指针</text>

  <g aria-label="A 循环链表">
    <rect class="node" x="56" y="78" width="48" height="38" fill="#f8fafc"/>
    <rect class="node" x="104" y="78" width="27" height="38" fill="#ede9fe"/>
    <text class="label" x="80" y="102" text-anchor="middle">A_1</text>
    <text class="field" x="117.5" y="101" text-anchor="middle">next</text>
    <rect class="node" x="143" y="78" width="48" height="38" fill="#f8fafc"/>
    <rect class="node" x="191" y="78" width="27" height="38" fill="#ede9fe"/>
    <text class="label" x="167" y="102" text-anchor="middle">A_2</text>
    <text class="field" x="204.5" y="101" text-anchor="middle">next</text>
    <rect class="node" x="230" y="78" width="48" height="38" fill="#f8fafc"/>
    <rect class="node" x="278" y="78" width="27" height="38" fill="#ede9fe"/>
    <text class="label" x="254" y="96" text-anchor="middle">A_i</text>
    <text class="label" x="254" y="110" text-anchor="middle">…</text>
    <text class="field" x="291.5" y="101" text-anchor="middle">next</text>
    <rect class="node" x="317" y="78" width="48" height="38" fill="#f8fafc"/>
    <rect class="node" x="365" y="78" width="27" height="38" fill="#ede9fe"/>
    <text class="label" x="341" y="102" text-anchor="middle">A_n</text>
    <text class="field" x="378.5" y="101" text-anchor="middle">next</text>
    <path class="arrow" d="M 133 97 H 140" marker-end="url(#arrow213)"/>
    <path class="arrow" d="M 220 97 H 227" marker-end="url(#arrow213)"/>
    <path class="arrow" d="M 307 97 H 314" marker-end="url(#arrow213)"/>
    <path class="arrow" d="M 391 78 C 421 65 424 69 424 77 C 424 84 421 89 393 97" marker-end="url(#arrow213)"/>
    <text class="label" x="445" y="103">A / A0</text>
  </g>

  <g aria-label="B 循环链表">
    <rect class="node" x="56" y="137" width="48" height="38" fill="#f8fafc"/>
    <rect class="node" x="104" y="137" width="27" height="38" fill="#ede9fe"/>
    <text class="label" x="80" y="161" text-anchor="middle">B_1</text>
    <text class="field" x="117.5" y="160" text-anchor="middle">next</text>
    <rect class="node" x="143" y="137" width="48" height="38" fill="#f8fafc"/>
    <rect class="node" x="191" y="137" width="27" height="38" fill="#ede9fe"/>
    <text class="label" x="167" y="161" text-anchor="middle">B_2</text>
    <text class="field" x="204.5" y="160" text-anchor="middle">next</text>
    <rect class="node" x="230" y="137" width="48" height="38" fill="#f8fafc"/>
    <rect class="node" x="278" y="137" width="27" height="38" fill="#ede9fe"/>
    <text class="label" x="254" y="155" text-anchor="middle">B_i</text>
    <text class="label" x="254" y="169" text-anchor="middle">…</text>
    <text class="field" x="291.5" y="160" text-anchor="middle">next</text>
    <rect class="node" x="317" y="137" width="48" height="38" fill="#f8fafc"/>
    <rect class="node" x="365" y="137" width="27" height="38" fill="#ede9fe"/>
    <text class="label" x="341" y="161" text-anchor="middle">B_m</text>
    <text class="field" x="378.5" y="160" text-anchor="middle">next</text>
    <path class="arrow" d="M 133 156 H 140" marker-end="url(#arrow213)"/>
    <path class="arrow" d="M 220 156 H 227" marker-end="url(#arrow213)"/>
    <path class="arrow" d="M 307 156 H 314" marker-end="url(#arrow213)"/>
    <path class="arrow" d="M 391 137 C 421 124 424 128 424 136 C 424 143 421 148 393 156" marker-end="url(#arrow213)"/>
    <text class="label" x="445" y="162">B / B0</text>
  </g>

  <text class="small" x="390" y="205" text-anchor="middle">A0/B0 重接后的顺序</text>
  <text class="panel" x="275" y="228" text-anchor="middle">(b) 合并后的表（只需改变两个尾指针）</text>

  <g aria-label="合并后的循环链表">
    <rect class="node" x="50" y="244" width="48" height="38" fill="#f8fafc"/>
    <rect class="node" x="98" y="244" width="27" height="38" fill="#ede9fe"/>
    <text class="label" x="74" y="268" text-anchor="middle">A_1</text>
    <text class="field" x="111.5" y="267" text-anchor="middle">next</text>
    <rect class="node" x="137" y="244" width="48" height="38" fill="#f8fafc"/>
    <rect class="node" x="185" y="244" width="27" height="38" fill="#ede9fe"/>
    <text class="label" x="161" y="262" text-anchor="middle">A_i</text>
    <text class="label" x="161" y="276" text-anchor="middle">…</text>
    <text class="field" x="198.5" y="267" text-anchor="middle">next</text>
    <rect class="node" x="224" y="244" width="48" height="38" fill="#f8fafc"/>
    <rect class="node" x="272" y="244" width="27" height="38" fill="#ede9fe"/>
    <text class="label" x="248" y="268" text-anchor="middle">A_n</text>
    <text class="field" x="285.5" y="267" text-anchor="middle">next</text>
    <rect class="node" x="311" y="244" width="48" height="38" fill="#f8fafc"/>
    <rect class="node" x="359" y="244" width="27" height="38" fill="#ede9fe"/>
    <text class="label" x="335" y="268" text-anchor="middle">B_1</text>
    <text class="field" x="372.5" y="267" text-anchor="middle">next</text>
    <rect class="node" x="398" y="244" width="48" height="38" fill="#f8fafc"/>
    <rect class="node" x="446" y="244" width="27" height="38" fill="#ede9fe"/>
    <text class="label" x="422" y="262" text-anchor="middle">B_i</text>
    <text class="label" x="422" y="276" text-anchor="middle">…</text>
    <text class="field" x="459.5" y="267" text-anchor="middle">next</text>
    <rect class="node" x="485" y="244" width="48" height="38" fill="#f8fafc"/>
    <rect class="node" x="533" y="244" width="27" height="38" fill="#ede9fe"/>
    <text class="label" x="509" y="268" text-anchor="middle">B_m</text>
    <text class="field" x="546.5" y="267" text-anchor="middle">next</text>
    <path class="arrow" d="M 127 263 H 134" marker-end="url(#arrow213)"/>
    <path class="arrow" d="M 214 263 H 221" marker-end="url(#arrow213)"/>
    <path class="arrow" d="M 301 263 H 308" marker-end="url(#arrow213)"/>
    <path class="arrow" d="M 388 263 H 395" marker-end="url(#arrow213)"/>
    <path class="arrow" d="M 475 263 H 482" marker-end="url(#arrow213)"/>
    <path class="arrow" d="M 559 244 C 577 234 590 239 590 247 C 590 257 578 264 562 268" marker-end="url(#arrow213)"/>
    <path class="bracket" d="M 585 244 h 12 M 597 244 V 282 h -12"/>
    <text class="label" x="633" y="268" text-anchor="middle">B0</text>
  </g>

  <g aria-label="两条尾指针重接关系">
    <text class="small" x="385" y="302" text-anchor="middle">A_n.next → B_1　　B_m.next → A_1</text>
  </g>
</svg>
