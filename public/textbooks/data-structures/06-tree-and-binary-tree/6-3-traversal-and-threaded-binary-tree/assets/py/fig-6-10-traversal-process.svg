<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="760" height="1440" viewBox="0 0 760 1440"
     role="img" aria-labelledby="fig610-title fig610-desc">
  <title id="fig610-title">图 6.10　三种遍历过程示意</title>
  <desc id="fig610-desc">先序、中序和后序遍历的递归执行过程。蓝色下行箭头表示递归调用，橙色上行箭头表示返回。</desc>
  <defs>
    <marker id="fig610-call-arrow" viewBox="0 0 12 12" refX="10" refY="6"
            markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#2f6fbd"/>
    </marker>
    <marker id="fig610-return-arrow" viewBox="0 0 12 12" refX="10" refY="6"
            markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#c8752b"/>
    </marker>
    <style>
      .fig610-title { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 30px; font-weight: 700; fill: #182433; }
      .fig610-header { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 26px; font-weight: 700; fill: #182433; }
      .fig610-body { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 21px; fill: #26384b; }
      .fig610-small { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 20px; fill: #536579; }
      .fig610-code { font-family: "SFMono-Regular", "Roboto Mono", monospace; font-size: 20px; fill: #26384b; }
      .fig610-node { fill: #f7fafc; stroke: #52677d; stroke-width: 3; }
      .fig610-card { fill: #ffffff; stroke: #d7e0e8; stroke-width: 2; }
      .fig610-call { fill: none; stroke: #2f6fbd; stroke-width: 4; stroke-linecap: round; marker-end: url(#fig610-call-arrow); }
      .fig610-return { fill: none; stroke: #c8752b; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 9 7; marker-end: url(#fig610-return-arrow); }
      .fig610-order { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 20px; fill: #26384b; }
    </style>
  </defs>

  <rect width="760" height="1440" fill="#ffffff"/>
  <text class="fig610-title" x="380" y="42" text-anchor="middle">图 6.10　三种遍历过程示意</text>

  <g aria-label="箭头图例">
    <path class="fig610-call" d="M 52 92 H 102"/>
    <text class="fig610-body" x="120" y="100">下行 = 递归调用</text>
    <path class="fig610-return" d="M 430 92 H 480"/>
    <text class="fig610-body" x="498" y="100">上行 = 返回</text>
  </g>

  <g aria-label="先序遍历：根-左-右">
    <rect class="fig610-card" x="24" y="130" width="712" height="365" rx="16"/>
    <text class="fig610-header" x="380" y="170" text-anchor="middle">先序：根-左-右</text>
    <rect class="fig610-node" x="300" y="192" width="160" height="56" rx="12"/>
    <text class="fig610-body" x="380" y="227" text-anchor="middle">当前结点 T</text>

    <path class="fig610-call" d="M 340 248 C 310 268 246 278 180 302"/>
    <path class="fig610-return" d="M 210 302 C 250 278 310 268 350 248"/>
    <path class="fig610-call" d="M 420 248 C 450 268 514 278 580 302"/>
    <path class="fig610-return" d="M 550 302 C 510 278 450 268 410 248"/>

    <rect class="fig610-node" x="55" y="302" width="250" height="76" rx="11"/>
    <text class="fig610-body" x="180" y="334" text-anchor="middle">递归左子树</text>
    <text class="fig610-code" x="180" y="362" text-anchor="middle">T-&gt;lchild</text>
    <rect class="fig610-node" x="455" y="302" width="250" height="76" rx="11"/>
    <text class="fig610-body" x="580" y="334" text-anchor="middle">递归右子树</text>
    <text class="fig610-code" x="580" y="362" text-anchor="middle">T-&gt;rchild</text>

    <text class="fig610-order" x="380" y="415" text-anchor="middle">① 访问根 T　→　② 左子树</text>
    <text class="fig610-order" x="380" y="443" text-anchor="middle">→　③ 右子树</text>
    <text class="fig610-small" x="380" y="474" text-anchor="middle">根的访问先于两次递归调用</text>
  </g>

  <g aria-label="中序遍历：左-根-右">
    <g transform="translate(0 380)">
      <rect class="fig610-card" x="24" y="130" width="712" height="365" rx="16"/>
      <text class="fig610-header" x="380" y="170" text-anchor="middle">中序：左-根-右</text>
      <rect class="fig610-node" x="300" y="192" width="160" height="56" rx="12"/>
      <text class="fig610-body" x="380" y="227" text-anchor="middle">当前结点 T</text>

      <path class="fig610-call" d="M 340 248 C 310 268 246 278 180 302"/>
      <path class="fig610-return" d="M 210 302 C 250 278 310 268 350 248"/>
      <path class="fig610-call" d="M 420 248 C 450 268 514 278 580 302"/>
      <path class="fig610-return" d="M 550 302 C 510 278 450 268 410 248"/>

      <rect class="fig610-node" x="55" y="302" width="250" height="76" rx="11"/>
      <text class="fig610-body" x="180" y="334" text-anchor="middle">递归左子树</text>
      <text class="fig610-code" x="180" y="362" text-anchor="middle">T-&gt;lchild</text>
      <rect class="fig610-node" x="455" y="302" width="250" height="76" rx="11"/>
      <text class="fig610-body" x="580" y="334" text-anchor="middle">递归右子树</text>
      <text class="fig610-code" x="580" y="362" text-anchor="middle">T-&gt;rchild</text>

      <text class="fig610-order" x="380" y="415" text-anchor="middle">① 左子树　→　② 访问根 T</text>
      <text class="fig610-order" x="380" y="443" text-anchor="middle">→　③ 右子树</text>
      <text class="fig610-small" x="380" y="474" text-anchor="middle">左子树返回后访问根，再递归右子树</text>
    </g>
  </g>

  <g aria-label="后序遍历：左-右-根">
    <g transform="translate(0 760)">
      <rect class="fig610-card" x="24" y="130" width="712" height="365" rx="16"/>
      <text class="fig610-header" x="380" y="170" text-anchor="middle">后序：左-右-根</text>
      <rect class="fig610-node" x="300" y="192" width="160" height="56" rx="12"/>
      <text class="fig610-body" x="380" y="227" text-anchor="middle">当前结点 T</text>

      <path class="fig610-call" d="M 340 248 C 310 268 246 278 180 302"/>
      <path class="fig610-return" d="M 210 302 C 250 278 310 268 350 248"/>
      <path class="fig610-call" d="M 420 248 C 450 268 514 278 580 302"/>
      <path class="fig610-return" d="M 550 302 C 510 278 450 268 410 248"/>

      <rect class="fig610-node" x="55" y="302" width="250" height="76" rx="11"/>
      <text class="fig610-body" x="180" y="334" text-anchor="middle">递归左子树</text>
      <text class="fig610-code" x="180" y="362" text-anchor="middle">T-&gt;lchild</text>
      <rect class="fig610-node" x="455" y="302" width="250" height="76" rx="11"/>
      <text class="fig610-body" x="580" y="334" text-anchor="middle">递归右子树</text>
      <text class="fig610-code" x="580" y="362" text-anchor="middle">T-&gt;rchild</text>

      <text class="fig610-order" x="380" y="415" text-anchor="middle">① 左子树　→　② 右子树</text>
      <text class="fig610-order" x="380" y="443" text-anchor="middle">→　③ 访问根 T</text>
      <text class="fig610-small" x="380" y="474" text-anchor="middle">两棵子树都返回后才访问根</text>
    </g>
  </g>

  <line x1="44" y1="1285" x2="716" y2="1285" stroke="#d8e0e8" stroke-width="2"/>
  <text class="fig610-small" x="380" y="1322" text-anchor="middle"><tspan x="380" dy="0">每个子树都按同一规则递归：下行进入子树，</tspan><tspan x="380" dy="30">完成后上行返回当前结点，再执行下一步。</tspan></text>
  <text class="fig610-small" x="380" y="1386" text-anchor="middle"><tspan x="380" dy="0">三种算法的差别只在于访问根结点与递归遍历左右子树的</tspan><tspan x="380" dy="30">先后关系。</tspan></text>
</svg>
