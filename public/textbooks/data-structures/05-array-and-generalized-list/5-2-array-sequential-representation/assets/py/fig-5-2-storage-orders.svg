<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="920" viewBox="0 0 1540 920" role="img" aria-labelledby="title desc">
<title id="title">图 5.2：二维数组的列主序和行主序存储方式</title>
<desc id="desc">左侧按列主序展开，右侧按行主序展开；每个展开序列保留全部元素、LOC 地址、向量关系和分组括号。</desc>
<style>
  .canvas { fill: #fff; }
  text { fill: #151515; font-family: "Times New Roman", "STIX Two Text", serif; }
  .box { fill: #fff; stroke: #222; stroke-width: 1.8; }
  .cell { font-size: 27px; }
  .brace { fill: none; stroke: #222; stroke-width: 2.4; }
  .formula { font-size: 24px; }
  .vector { font-size: 26px; }
  .caption { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 25px; font-weight: 600; }
  .sub { font-size: 0.62em; baseline-shift: sub; }
  .sup { font-size: 0.62em; baseline-shift: super; }
  .bar { text-decoration: overline; text-decoration-thickness: 2px; }
  .italic { font-style: italic; }
</style>
<rect class="canvas" width="1540" height="920"/>

<!-- (a) column-major order -->
<g aria-label="列主序">
  <rect class="box" x="390" y="80" width="150" height="48"/><text x="465" y="112" class="cell" text-anchor="middle">a<tspan class="sub">00</tspan></text>
  <rect class="box" x="390" y="128" width="150" height="48"/><text x="465" y="160" class="cell" text-anchor="middle">a<tspan class="sub">10</tspan></text>
  <rect class="box" x="390" y="176" width="150" height="48"/><text x="465" y="208" class="cell" text-anchor="middle">…</text>
  <rect class="box" x="390" y="224" width="150" height="48"/><text x="465" y="256" class="cell" text-anchor="middle">a<tspan class="sub">m−1,0</tspan></text>

  <rect class="box" x="390" y="272" width="150" height="48"/><text x="465" y="304" class="cell" text-anchor="middle">a<tspan class="sub">01</tspan></text>
  <rect class="box" x="390" y="320" width="150" height="48"/><text x="465" y="352" class="cell" text-anchor="middle">a<tspan class="sub">11</tspan></text>
  <rect class="box" x="390" y="368" width="150" height="48"/><text x="465" y="400" class="cell" text-anchor="middle">…</text>
  <rect class="box" x="390" y="416" width="150" height="48"/><text x="465" y="448" class="cell" text-anchor="middle">a<tspan class="sub">m−1,1</tspan></text>

  <rect class="box" x="390" y="464" width="150" height="48"/><text x="465" y="496" class="cell" text-anchor="middle">a<tspan class="sub">0,n−1</tspan></text>
  <rect class="box" x="390" y="512" width="150" height="48"/><text x="465" y="544" class="cell" text-anchor="middle">a<tspan class="sub">1,n−1</tspan></text>
  <rect class="box" x="390" y="560" width="150" height="48"/><text x="465" y="592" class="cell" text-anchor="middle">…</text>
  <rect class="box" x="390" y="608" width="150" height="48"/><text x="465" y="640" class="cell" text-anchor="middle">a<tspan class="sub">m−1,n−1</tspan></text>

  <path class="brace" d="M 570 80 q 18 12 0 24 v 144 q 18 12 0 24"/>
  <path class="brace" d="M 570 272 q 18 12 0 24 v 144 q 18 12 0 24"/>
  <path class="brace" d="M 570 464 q 18 12 0 24 v 192 q 18 12 0 24"/>
  <text x="615" y="180" class="vector" text-anchor="start"><tspan class="bar">A</tspan><tspan class="sub">0</tspan><tspan class="sup">(1)</tspan></text>
  <text x="615" y="372" class="vector" text-anchor="start"><tspan class="bar">A</tspan><tspan class="sub">1</tspan><tspan class="sup">(1)</tspan></text>
  <text x="615" y="564" class="vector" text-anchor="start"><tspan class="bar">A</tspan><tspan class="sub">n−1</tspan><tspan class="sup">(1)</tspan></text>

  <text x="360" y="112" class="formula" text-anchor="end">LOC(<tspan class="bar">A</tspan><tspan class="sub">0</tspan><tspan class="sup">(1)</tspan>)=LOC(a<tspan class="sub">00</tspan>)</text>
  <text x="360" y="304" class="formula" text-anchor="end">LOC(<tspan class="bar">A</tspan><tspan class="sub">1</tspan><tspan class="sup">(1)</tspan>)=LOC(a<tspan class="sub">01</tspan>)</text>
  <text x="360" y="496" class="formula" text-anchor="end">LOC(<tspan class="bar">A</tspan><tspan class="sub">n−1</tspan><tspan class="sup">(1)</tspan>)=LOC(a<tspan class="sub">0,n−1</tspan>)</text>

  <text x="465" y="730" class="vector" text-anchor="middle"><tspan class="italic">A</tspan><tspan class="sup">(2)</tspan> = (<tspan class="bar">A</tspan><tspan class="sub">0</tspan><tspan class="sup">(1)</tspan>, <tspan class="bar">A</tspan><tspan class="sub">1</tspan><tspan class="sup">(1)</tspan>, …, <tspan class="bar">A</tspan><tspan class="sub">n−1</tspan><tspan class="sup">(1)</tspan>)</text>
  <text x="465" y="770" class="vector" text-anchor="middle"><tspan class="bar">A</tspan><tspan class="sub">j</tspan><tspan class="sup">(1)</tspan> = (a<tspan class="sub">0j</tspan>, a<tspan class="sub">1j</tspan>, …, a<tspan class="sub">m−1,j</tspan>)</text>
  <text x="465" y="820" class="vector" text-anchor="middle">(a)</text>
</g>

<!-- (b) row-major order -->
<g aria-label="行主序">
  <rect class="box" x="1020" y="80" width="150" height="48"/><text x="1095" y="112" class="cell" text-anchor="middle">a<tspan class="sub">00</tspan></text>
  <rect class="box" x="1020" y="128" width="150" height="48"/><text x="1095" y="160" class="cell" text-anchor="middle">a<tspan class="sub">01</tspan></text>
  <rect class="box" x="1020" y="176" width="150" height="48"/><text x="1095" y="208" class="cell" text-anchor="middle">…</text>
  <rect class="box" x="1020" y="224" width="150" height="48"/><text x="1095" y="256" class="cell" text-anchor="middle">a<tspan class="sub">0,n−1</tspan></text>

  <rect class="box" x="1020" y="272" width="150" height="48"/><text x="1095" y="304" class="cell" text-anchor="middle">a<tspan class="sub">10</tspan></text>
  <rect class="box" x="1020" y="320" width="150" height="48"/><text x="1095" y="352" class="cell" text-anchor="middle">a<tspan class="sub">11</tspan></text>
  <rect class="box" x="1020" y="368" width="150" height="48"/><text x="1095" y="400" class="cell" text-anchor="middle">…</text>
  <rect class="box" x="1020" y="416" width="150" height="48"/><text x="1095" y="448" class="cell" text-anchor="middle">a<tspan class="sub">1,n−1</tspan></text>

  <rect class="box" x="1020" y="464" width="150" height="48"/><text x="1095" y="496" class="cell" text-anchor="middle">a<tspan class="sub">m−1,0</tspan></text>
  <rect class="box" x="1020" y="512" width="150" height="48"/><text x="1095" y="544" class="cell" text-anchor="middle">a<tspan class="sub">m−1,1</tspan></text>
  <rect class="box" x="1020" y="560" width="150" height="48"/><text x="1095" y="592" class="cell" text-anchor="middle">…</text>
  <rect class="box" x="1020" y="608" width="150" height="48"/><text x="1095" y="640" class="cell" text-anchor="middle">a<tspan class="sub">m−1,n−1</tspan></text>

  <path class="brace" d="M 1200 80 q 18 12 0 24 v 144 q 18 12 0 24"/>
  <path class="brace" d="M 1200 272 q 18 12 0 24 v 144 q 18 12 0 24"/>
  <path class="brace" d="M 1200 464 q 18 12 0 24 v 192 q 18 12 0 24"/>
  <text x="1245" y="180" class="vector" text-anchor="start"><tspan class="italic">A</tspan><tspan class="sub">0</tspan><tspan class="sup">(1)</tspan></text>
  <text x="1245" y="372" class="vector" text-anchor="start"><tspan class="italic">A</tspan><tspan class="sub">1</tspan><tspan class="sup">(1)</tspan></text>
  <text x="1245" y="564" class="vector" text-anchor="start"><tspan class="italic">A</tspan><tspan class="sub">m−1</tspan><tspan class="sup">(1)</tspan></text>

  <text x="990" y="112" class="formula" text-anchor="end">LOC(A<tspan class="sub">0</tspan><tspan class="sup">(1)</tspan>)=LOC(a<tspan class="sub">00</tspan>)</text>
  <text x="990" y="304" class="formula" text-anchor="end">LOC(A<tspan class="sub">1</tspan><tspan class="sup">(1)</tspan>)=LOC(a<tspan class="sub">10</tspan>)</text>
  <text x="990" y="496" class="formula" text-anchor="end">LOC(A<tspan class="sub">m−1</tspan><tspan class="sup">(1)</tspan>)=LOC(a<tspan class="sub">m−1,0</tspan>)</text>

  <text x="1095" y="730" class="vector" text-anchor="middle"><tspan class="italic">A</tspan><tspan class="sup">(2)</tspan> = (A<tspan class="sub">0</tspan><tspan class="sup">(1)</tspan>, A<tspan class="sub">1</tspan><tspan class="sup">(1)</tspan>, …, A<tspan class="sub">m−1</tspan><tspan class="sup">(1)</tspan>)</text>
  <text x="1095" y="770" class="vector" text-anchor="middle">A<tspan class="sub">i</tspan><tspan class="sup">(1)</tspan> = (a<tspan class="sub">i0</tspan>, a<tspan class="sub">i1</tspan>, …, a<tspan class="sub">i,n−1</tspan>)</text>
  <text x="1095" y="820" class="vector" text-anchor="middle">(b)</text>
</g>

<text x="770" y="895" class="caption" text-anchor="middle">图 5.2　二位数组的两种存储方式</text>
</svg>
