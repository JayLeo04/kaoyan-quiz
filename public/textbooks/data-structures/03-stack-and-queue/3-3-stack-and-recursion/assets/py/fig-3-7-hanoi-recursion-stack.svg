<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="882" viewBox="0 0 1080 882"><style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#18212f}.t{font-size:15px}.s{font-size:12px}.xs{font-size:10px}.box{fill:#f7f9fc;stroke:#243447;stroke-width:1.4}.line{stroke:#243447;stroke-width:1.4;fill:none}.accent{fill:#e8f1ff;stroke:#1967d2;stroke-width:1.4}</style><text class="t" x="18" y="24">hanoi(3,a,b,c) 的递归工作栈状态变化</text><rect class="accent" x="18" y="38" width="58" height="34"/><text class="s" x="22" y="59">层次</text><rect class="accent" x="76" y="38" width="66" height="34"/><text class="s" x="80" y="59">行号</text><rect class="accent" x="142" y="38" width="288" height="34"/><text class="s" x="146" y="59">工作记录（栈顶在前）</text><rect class="accent" x="430" y="38" width="210" height="34"/><text class="s" x="434" y="59">塔与圆盘状态</text><rect class="accent" x="640" y="38" width="420" height="34"/><text class="s" x="644" y="59">说明</text><rect class="box" x="18" y="72" width="58" height="57"/><rect class="box" x="76" y="72" width="66" height="57"/><rect class="box" x="142" y="72" width="288" height="57"/><rect class="box" x="430" y="72" width="210" height="57"/><rect class="box" x="640" y="72" width="420" height="57"/><text class="s" x="40" y="100">1</text><text class="xs" x="80" y="100">1,2,4,5</text><text class="xs" x="149" y="87">▶ 0,3,a,b,c</text><text class="xs" x="436" y="100">a: 1,2,3；b: —；c: —</text><text class="xs" x="646" y="92">由主函数进入第 1 层递归后，运行至语句（行 5）</text><text class="xs" x="646" y="110">，因递归调用而进入下一层。</text><rect class="box" x="18" y="129" width="58" height="57"/><rect class="box" x="76" y="129" width="66" height="57"/><rect class="box" x="142" y="129" width="288" height="57"/><rect class="box" x="430" y="129" width="210" height="57"/><rect class="box" x="640" y="129" width="420" height="57"/><text class="s" x="40" y="157">2</text><text class="xs" x="80" y="157">1,2,4,5</text><text class="xs" x="149" y="144">▶ 6,2,a,c,b</text><text class="xs" x="149" y="157">▶ 0,3,a,b,c</text><text class="xs" x="436" y="157">a: 1,2,3；b: —；c: —</text><text class="xs" x="646" y="149">由第 1 层的语句（行 5）进入第 2 层递归，执</text><text class="xs" x="646" y="167">行至语句（行 5）。</text><rect class="box" x="18" y="186" width="58" height="57"/><rect class="box" x="76" y="186" width="66" height="57"/><rect class="box" x="142" y="186" width="288" height="57"/><rect class="box" x="430" y="186" width="210" height="57"/><rect class="box" x="640" y="186" width="420" height="57"/><text class="s" x="40" y="214">3</text><text class="xs" x="80" y="214">1,2,3,9</text><text class="xs" x="149" y="201">▶ 6,1,a,b,c</text><text class="xs" x="149" y="214">▶ 6,2,a,c,b</text><text class="xs" x="149" y="227">▶ 0,3,a,b,c</text><text class="xs" x="436" y="214">a: 2,3；b: —；c: 1</text><text class="xs" x="646" y="206">将 1 号圆盘由 a 移至 c 后，从语句（行 9</text><text class="xs" x="646" y="224">）退出第 3 层，返回至第 2 层的语句（行 6）。</text><rect class="box" x="18" y="243" width="58" height="57"/><rect class="box" x="76" y="243" width="66" height="57"/><rect class="box" x="142" y="243" width="288" height="57"/><rect class="box" x="430" y="243" width="210" height="57"/><rect class="box" x="640" y="243" width="420" height="57"/><text class="s" x="40" y="271">2</text><text class="xs" x="80" y="271">6,7</text><text class="xs" x="149" y="258">▶ 6,2,a,c,b</text><text class="xs" x="149" y="271">▶ 0,3,a,b,c</text><text class="xs" x="436" y="271">a: 3；b: 2；c: 1</text><text class="xs" x="646" y="263">将 2 号圆盘由 a 移至 b 后，从语句（行 7</text><text class="xs" x="646" y="281">）进入下一层递归。</text><rect class="box" x="18" y="300" width="58" height="57"/><rect class="box" x="76" y="300" width="66" height="57"/><rect class="box" x="142" y="300" width="288" height="57"/><rect class="box" x="430" y="300" width="210" height="57"/><rect class="box" x="640" y="300" width="420" height="57"/><text class="s" x="40" y="328">3</text><text class="xs" x="80" y="328">1,2,3,9</text><text class="xs" x="149" y="315">▶ 8,1,c,a,b</text><text class="xs" x="149" y="328">▶ 6,2,a,c,b</text><text class="xs" x="149" y="341">▶ 0,3,a,b,c</text><text class="xs" x="436" y="328">a: 3；b: 2,1；c: —</text><text class="xs" x="646" y="320">将 1 号圆盘由 c 移至 b 后，从语句（行 9</text><text class="xs" x="646" y="338">）退出第 3 层，返回至第 2 层的语句（行 8）。</text><rect class="box" x="18" y="357" width="58" height="57"/><rect class="box" x="76" y="357" width="66" height="57"/><rect class="box" x="142" y="357" width="288" height="57"/><rect class="box" x="430" y="357" width="210" height="57"/><rect class="box" x="640" y="357" width="420" height="57"/><text class="s" x="40" y="385">2</text><text class="xs" x="80" y="385">8,9</text><text class="xs" x="149" y="372">▶ 6,2,a,c,b</text><text class="xs" x="149" y="385">▶ 0,3,a,b,c</text><text class="xs" x="436" y="385">a: 3；b: 2,1；c: —</text><text class="xs" x="646" y="377">从语句（行 9）退出第 2 层，返回至第 1 层的</text><text class="xs" x="646" y="395">语句（行 6）。</text><rect class="box" x="18" y="414" width="58" height="57"/><rect class="box" x="76" y="414" width="66" height="57"/><rect class="box" x="142" y="414" width="288" height="57"/><rect class="box" x="430" y="414" width="210" height="57"/><rect class="box" x="640" y="414" width="420" height="57"/><text class="s" x="40" y="442">1</text><text class="xs" x="80" y="442">6,7</text><text class="xs" x="149" y="429">▶ 0,3,a,b,c</text><text class="xs" x="436" y="442">a: —；b: 2,1；c: 3</text><text class="xs" x="646" y="434">将 3 号圆盘由 a 移至 c 后，从语句（行 7</text><text class="xs" x="646" y="452">）进入下一层递归。</text><rect class="box" x="18" y="471" width="58" height="57"/><rect class="box" x="76" y="471" width="66" height="57"/><rect class="box" x="142" y="471" width="288" height="57"/><rect class="box" x="430" y="471" width="210" height="57"/><rect class="box" x="640" y="471" width="420" height="57"/><text class="s" x="40" y="499">2</text><text class="xs" x="80" y="499">1,2,4,5</text><text class="xs" x="149" y="486">▶ 8,2,b,a,c</text><text class="xs" x="149" y="499">▶ 0,3,a,b,c</text><text class="xs" x="436" y="499">a: —；b: 2,1；c: 3</text><text class="xs" x="646" y="491">从第 2 层的语句（行 5）进入第 3 层递归。</text><text class="xs" x="646" y="509"></text><rect class="box" x="18" y="528" width="58" height="57"/><rect class="box" x="76" y="528" width="66" height="57"/><rect class="box" x="142" y="528" width="288" height="57"/><rect class="box" x="430" y="528" width="210" height="57"/><rect class="box" x="640" y="528" width="420" height="57"/><text class="s" x="40" y="556">3</text><text class="xs" x="80" y="556">1,2,3,9</text><text class="xs" x="149" y="543">▶ 6,1,b,c,a</text><text class="xs" x="149" y="556">▶ 8,2,b,a,c</text><text class="xs" x="149" y="569">▶ 0,3,a,b,c</text><text class="xs" x="436" y="556">a: 1；b: 2；c: 3</text><text class="xs" x="646" y="548">将 1 号圆盘由 b 移至 a 后，从语句（行 9</text><text class="xs" x="646" y="566">）退出第 3 层，返回至第 2 层的语句（行 6）。</text><rect class="box" x="18" y="585" width="58" height="57"/><rect class="box" x="76" y="585" width="66" height="57"/><rect class="box" x="142" y="585" width="288" height="57"/><rect class="box" x="430" y="585" width="210" height="57"/><rect class="box" x="640" y="585" width="420" height="57"/><text class="s" x="40" y="613">2</text><text class="xs" x="80" y="613">6,7</text><text class="xs" x="149" y="600">▶ 8,2,b,a,c</text><text class="xs" x="149" y="613">▶ 0,3,a,b,c</text><text class="xs" x="436" y="613">a: 1；b: —；c: 2,3</text><text class="xs" x="646" y="605">将 2 号圆盘由 b 移至 c 后，从语句（行 7</text><text class="xs" x="646" y="623">）进入下一层递归。</text><rect class="box" x="18" y="642" width="58" height="57"/><rect class="box" x="76" y="642" width="66" height="57"/><rect class="box" x="142" y="642" width="288" height="57"/><rect class="box" x="430" y="642" width="210" height="57"/><rect class="box" x="640" y="642" width="420" height="57"/><text class="s" x="40" y="670">3</text><text class="xs" x="80" y="670">1,2,3,9</text><text class="xs" x="149" y="657">▶ 8,1,a,b,c</text><text class="xs" x="149" y="670">▶ 8,2,b,a,c</text><text class="xs" x="149" y="683">▶ 0,3,a,b,c</text><text class="xs" x="436" y="670">a: —；b: —；c: 1,2,3</text><text class="xs" x="646" y="662">将 1 号圆盘由 a 移至 c 后，从语句（行 9</text><text class="xs" x="646" y="680">）退出第 3 层，返回至第 2 层的语句（行 8）。</text><rect class="box" x="18" y="699" width="58" height="57"/><rect class="box" x="76" y="699" width="66" height="57"/><rect class="box" x="142" y="699" width="288" height="57"/><rect class="box" x="430" y="699" width="210" height="57"/><rect class="box" x="640" y="699" width="420" height="57"/><text class="s" x="40" y="727">2</text><text class="xs" x="80" y="727">8,9</text><text class="xs" x="149" y="714">▶ 8,2,b,a,c</text><text class="xs" x="149" y="727">▶ 0,3,a,b,c</text><text class="xs" x="436" y="727">a: —；b: —；c: 1,2,3</text><text class="xs" x="646" y="719">从语句（行 9）退出第 2 层，返回至第 1 层的</text><text class="xs" x="646" y="737">语句（行 8）。</text><rect class="box" x="18" y="756" width="58" height="57"/><rect class="box" x="76" y="756" width="66" height="57"/><rect class="box" x="142" y="756" width="288" height="57"/><rect class="box" x="430" y="756" width="210" height="57"/><rect class="box" x="640" y="756" width="420" height="57"/><text class="s" x="40" y="784">1</text><text class="xs" x="80" y="784">8,9</text><text class="xs" x="149" y="771">▶ 0,3,a,b,c</text><text class="xs" x="436" y="784">a: —；b: —；c: 1,2,3</text><text class="xs" x="646" y="776">从语句（行 9）退出递归函数，返回至主函数。</text><text class="xs" x="646" y="794"></text><rect class="box" x="18" y="813" width="58" height="57"/><rect class="box" x="76" y="813" width="66" height="57"/><rect class="box" x="142" y="813" width="288" height="57"/><rect class="box" x="430" y="813" width="210" height="57"/><rect class="box" x="640" y="813" width="420" height="57"/><text class="s" x="40" y="841">0</text><text class="xs" x="80" y="841"></text><text class="xs" x="149" y="828">▶ 栈空</text><text class="xs" x="436" y="841">a: —；b: —；c: 1,2,3</text><text class="xs" x="646" y="833">继续运行主函数。</text><text class="xs" x="646" y="851"></text></svg>