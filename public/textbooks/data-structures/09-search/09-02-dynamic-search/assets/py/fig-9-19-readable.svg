    <text class="ptr" x="602" y="414">infoptr→CHANG</text>
    <rect class="char" x="492" y="448" width="36" height="30" rx="7"/><text class="charText" x="510" y="463">$</text>
    <path class="edge" d="M418 463 L490 463"/><text class="ptr" x="536" y="469">infoptr → CHAO</text>
    <rect class="char" x="382" y="513" width="36" height="30" rx="7"/><text class="charText" x="400" y="528">$</text>
    <path class="edge" d="M308 528 L380 528"/><text class="ptr" x="426" y="534">infoptr → CHEN</text>
  </g>

