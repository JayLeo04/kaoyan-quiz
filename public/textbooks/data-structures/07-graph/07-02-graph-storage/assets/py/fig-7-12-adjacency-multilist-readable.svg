<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1360" height="900" viewBox="0 0 1360 900"
     role="img" aria-labelledby="fig712-title fig712-desc">
  <title id="fig712-title">图 7.12 无向图 G₂ 的邻接多重表</title>
  <desc id="fig712-desc">G₂ 的六条无向边各由一个 EBox 表示；每个 EBox 通过 ilink 和 jlink 同时接入两个顶点链。图中保留顶点表、边表、mark、ivex、jvex、ilink、jlink、info、firstedge 及链路方向。</desc>
  <defs>
    <marker id="fig712-link-arrow" viewBox="0 0 12 12" refX="10" refY="6"
            markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#2f6fbd"/>
    </marker>
    <style><![CDATA[
      .fig712-title { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; font-size: 32px; font-weight: 700; fill: #182433; }
      .fig712-section { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; font-size: 24px; font-weight: 700; fill: #1d3f63; }
      .fig712-body { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; font-size: 20px; fill: #26384b; }
      .fig712-small { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; font-size: 17px; fill: #536579; }
      .fig712-code { font-family: "SFMono-Regular", Consolas, "Roboto Mono", monospace; font-size: 19px; fill: #26384b; }
      .fig712-panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; }
      .fig712-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .fig712-header { fill: #e7eef6; stroke: #c1d0df; stroke-width: 1.5; }
      .fig712-grid { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .fig712-vertex { fill: #eaf2fb; stroke: #2f5e88; stroke-width: 2.5; }
      .fig712-graph-edge { fill: none; stroke: #64748b; stroke-width: 3; stroke-linecap: round; }
      .fig712-edge-label { font-family: "SFMono-Regular", Consolas, monospace; font-size: 16px; font-weight: 700; fill: #a15c27; }
      .fig712-link { fill: none; stroke: #2f6fbd; stroke-width: 2.5; marker-end: url(#fig712-link-arrow); }
      .fig712-unknown { fill: #697586; }
    ]]></style>
  </defs>

  <rect width="1360" height="900" fill="#ffffff"/>
  <text class="fig712-title" x="680" y="40" text-anchor="middle">图 7.12　无向图 G₂ 的邻接多重表</text>
  <text class="fig712-small" x="680" y="68" text-anchor="middle">每条无向边只保存一个 EBox；同一个 EBox 由 ilink、jlink 同时归入两个顶点链</text>

  <g aria-label="G₂ 六条无向边的拓扑">
    <rect class="fig712-panel" x="24" y="88" width="400" height="250" rx="14"/>
    <text class="fig712-section" x="46" y="122">G₂ 拓扑（六条无向边）</text>

    <path class="fig712-graph-edge" d="M 138 178 H 286"/>
    <path class="fig712-graph-edge" d="M 100 198 V 248"/>
    <path class="fig712-graph-edge" d="M 324 198 V 248"/>
    <path class="fig712-graph-edge" d="M 286 190 L 250 218"/>
    <path class="fig712-graph-edge" d="M 286 268 L 250 238"/>
    <path class="fig712-graph-edge" d="M 286 268 H 138"/>

    <text class="fig712-edge-label" x="212" y="165" text-anchor="middle">E01</text>
    <text class="fig712-edge-label" x="114" y="226">E02</text>
    <text class="fig712-edge-label" x="340" y="226">E03</text>
    <text class="fig712-edge-label" x="260" y="207">E04</text>
    <text class="fig712-edge-label" x="260" y="258">E06</text>
    <text class="fig712-edge-label" x="212" y="307" text-anchor="middle">E05</text>

    <rect class="fig712-vertex" x="62" y="158" width="76" height="40" rx="10"/>
    <rect class="fig712-vertex" x="286" y="158" width="76" height="40" rx="10"/>
    <rect class="fig712-vertex" x="286" y="248" width="76" height="40" rx="10"/>
    <rect class="fig712-vertex" x="62" y="248" width="76" height="40" rx="10"/>
    <rect class="fig712-vertex" x="174" y="203" width="76" height="40" rx="10"/>
    <text class="fig712-body" x="100" y="184" text-anchor="middle">0: V1</text>
    <text class="fig712-body" x="324" y="184" text-anchor="middle">1: V2</text>
    <text class="fig712-body" x="324" y="274" text-anchor="middle">2: V3</text>
    <text class="fig712-body" x="100" y="274" text-anchor="middle">3: V4</text>
    <text class="fig712-body" x="212" y="229" text-anchor="middle">4: V5</text>
  </g>

  <g aria-label="正文定义的顶点和边结点字段">
    <rect class="fig712-panel" x="444" y="88" width="892" height="250" rx="14"/>
    <text class="fig712-section" x="466" y="122">存储字段（源正文定义）</text>

    <rect class="fig712-card" x="464" y="142" width="390" height="164" rx="10"/>
    <text class="fig712-section" x="484" y="172" font-size="22">VexBox（顶点表）</text>
    <rect class="fig712-header" x="484" y="185" width="170" height="40"/>
    <rect class="fig712-header" x="654" y="185" width="180" height="40"/>
    <text class="fig712-code" x="569" y="211" text-anchor="middle">data</text>
    <text class="fig712-code" x="744" y="211" text-anchor="middle">firstedge</text>
    <text class="fig712-small" x="484" y="251">存储顶点信息（如 V1）</text>
    <text class="fig712-small" x="484" y="278">指向该顶点的第一条依附边</text>

    <rect class="fig712-card" x="874" y="142" width="442" height="164" rx="10"/>
    <text class="fig712-section" x="894" y="172" font-size="22">EBox（唯一边结点）</text>
    <rect class="fig712-header" x="894" y="185" width="408" height="38"/>
    <path d="M 962 185 V 223 M 1030 185 V 223 M 1100 185 V 223 M 1168 185 V 223 M 1238 185 V 223" stroke="#c1d0df" stroke-width="1.5"/>
    <text class="fig712-code" x="928" y="210" text-anchor="middle">mark</text>
    <text class="fig712-code" x="996" y="210" text-anchor="middle">ivex</text>
    <text class="fig712-code" x="1065" y="210" text-anchor="middle">ilink</text>
    <text class="fig712-code" x="1134" y="210" text-anchor="middle">jvex</text>
    <text class="fig712-code" x="1203" y="210" text-anchor="middle">jlink</text>
    <text class="fig712-code" x="1270" y="210" text-anchor="middle">info</text>
    <text class="fig712-small" x="894" y="244">mark：访问标记（unvisited / visited）</text>
    <text class="fig712-small" x="894" y="267">ivex/jvex：两个依附顶点的位置</text>
    <text class="fig712-small" x="894" y="290">ilink/jlink：各自顶点链的下一条边　info：边信息指针</text>
  </g>

  <g aria-label="六个唯一 EBox 的字段和链接目标">
    <rect class="fig712-panel" x="24" y="360" width="1312" height="270" rx="14"/>
    <text class="fig712-section" x="46" y="394">边表：六个唯一 EBox 及其双链域</text>
    <rect class="fig712-header" x="44" y="410" width="990" height="36"/>
    <path d="M 194 410 V 608 M 324 410 V 608 M 404 410 V 608 M 604 410 V 608 M 684 410 V 608 M 884 410 V 608" stroke="#cbd5e1" stroke-width="1.5"/>
    <text class="fig712-code" x="119" y="434" text-anchor="middle">EBox / edge</text>
    <text class="fig712-code" x="259" y="434" text-anchor="middle">mark</text>
    <text class="fig712-code" x="364" y="434" text-anchor="middle">ivex</text>
    <text class="fig712-code" x="504" y="434" text-anchor="middle">ilink</text>
    <text class="fig712-code" x="644" y="434" text-anchor="middle">jvex</text>
    <text class="fig712-code" x="784" y="434" text-anchor="middle">jlink</text>
    <text class="fig712-code" x="959" y="434" text-anchor="middle">info</text>

    <g class="fig712-body">
      <rect class="fig712-grid" x="44" y="446" width="990" height="27"/>
      <rect class="fig712-grid" x="44" y="473" width="990" height="27"/>
      <rect class="fig712-grid" x="44" y="500" width="990" height="27"/>
      <rect class="fig712-grid" x="44" y="527" width="990" height="27"/>
      <rect class="fig712-grid" x="44" y="554" width="990" height="27"/>
      <rect class="fig712-grid" x="44" y="581" width="990" height="27"/>
      <text x="119" y="465" text-anchor="middle">E01　(0,1)</text>
      <text class="fig712-unknown" x="259" y="465" text-anchor="middle">—</text>
      <text x="364" y="465" text-anchor="middle">0</text>
      <text x="504" y="465" text-anchor="middle">→ E02</text>
      <text x="644" y="465" text-anchor="middle">1</text>
      <text x="784" y="465" text-anchor="middle">→ E03</text>
      <text class="fig712-unknown" x="959" y="465" text-anchor="middle">—</text>

      <text x="119" y="492" text-anchor="middle">E02　(0,3)</text>
      <text class="fig712-unknown" x="259" y="492" text-anchor="middle">—</text>
      <text x="364" y="492" text-anchor="middle">0</text>
      <text x="504" y="492" text-anchor="middle">→ NULL</text>
      <text x="644" y="492" text-anchor="middle">3</text>
      <text x="784" y="492" text-anchor="middle">→ E05</text>
      <text class="fig712-unknown" x="959" y="492" text-anchor="middle">—</text>

      <text x="119" y="519" text-anchor="middle">E03　(1,2)</text>
      <text class="fig712-unknown" x="259" y="519" text-anchor="middle">—</text>
      <text x="364" y="519" text-anchor="middle">1</text>
      <text x="504" y="519" text-anchor="middle">→ E04</text>
      <text x="644" y="519" text-anchor="middle">2</text>
      <text x="784" y="519" text-anchor="middle">→ E05</text>
      <text class="fig712-unknown" x="959" y="519" text-anchor="middle">—</text>

      <text x="119" y="546" text-anchor="middle">E04　(1,4)</text>
      <text class="fig712-unknown" x="259" y="546" text-anchor="middle">—</text>
      <text x="364" y="546" text-anchor="middle">1</text>
      <text x="504" y="546" text-anchor="middle">→ NULL</text>
      <text x="644" y="546" text-anchor="middle">4</text>
      <text x="784" y="546" text-anchor="middle">→ E06</text>
      <text class="fig712-unknown" x="959" y="546" text-anchor="middle">—</text>

      <text x="119" y="573" text-anchor="middle">E05　(2,3)</text>
      <text class="fig712-unknown" x="259" y="573" text-anchor="middle">—</text>
      <text x="364" y="573" text-anchor="middle">2</text>
      <text x="504" y="573" text-anchor="middle">→ E06</text>
      <text x="644" y="573" text-anchor="middle">3</text>
      <text x="784" y="573" text-anchor="middle">→ NULL</text>
      <text class="fig712-unknown" x="959" y="573" text-anchor="middle">—</text>

      <text x="119" y="600" text-anchor="middle">E06　(2,4)</text>
      <text class="fig712-unknown" x="259" y="600" text-anchor="middle">—</text>
      <text x="364" y="600" text-anchor="middle">2</text>
      <text x="504" y="600" text-anchor="middle">→ NULL</text>
      <text x="644" y="600" text-anchor="middle">4</text>
      <text x="784" y="600" text-anchor="middle">→ NULL</text>
      <text class="fig712-unknown" x="959" y="600" text-anchor="middle">—</text>
    </g>

    <text class="fig712-small" x="1060" y="448">每行是一个唯一边结点。</text>
    <text class="fig712-small" x="1060" y="475">— 表示源图未给出该字段</text>
    <text class="fig712-small" x="1060" y="498">的具体 mark / info 值；</text>
    <text class="fig712-small" x="1060" y="521">字段本身仍被保留。</text>
    <text class="fig712-small" x="1060" y="558">两列链接目标分别服务</text>
    <text class="fig712-small" x="1060" y="581">ivex 链和 jvex 链。</text>
  </g>

  <g aria-label="顶点表和五条顶点链">
    <rect class="fig712-panel" x="24" y="650" width="1312" height="230" rx="14"/>
    <text class="fig712-section" x="46" y="684">顶点表与依附链</text>
    <text class="fig712-small" x="330" y="684">以下按 E 编号升序展示一种规范链序；源文未规定唯一排列，但每条边恰接入两个顶点链</text>

    <rect class="fig712-header" x="44" y="704" width="250" height="28"/>
    <path d="M 194 704 V 872" stroke="#c1d0df" stroke-width="1.5"/>
    <text class="fig712-code" x="119" y="724" text-anchor="middle">data / index</text>
    <text class="fig712-code" x="244" y="724" text-anchor="middle">firstedge</text>
    <g class="fig712-body">
      <rect class="fig712-grid" x="44" y="732" width="250" height="28"/>
      <rect class="fig712-grid" x="44" y="760" width="250" height="28"/>
      <rect class="fig712-grid" x="44" y="788" width="250" height="28"/>
      <rect class="fig712-grid" x="44" y="816" width="250" height="28"/>
      <rect class="fig712-grid" x="44" y="844" width="250" height="28"/>
      <text x="119" y="752" text-anchor="middle">0　V1</text><text x="244" y="752" text-anchor="middle">→ E01</text>
      <text x="119" y="780" text-anchor="middle">1　V2</text><text x="244" y="780" text-anchor="middle">→ E01</text>
      <text x="119" y="808" text-anchor="middle">2　V3</text><text x="244" y="808" text-anchor="middle">→ E03</text>
      <text x="119" y="836" text-anchor="middle">3　V4</text><text x="244" y="836" text-anchor="middle">→ E02</text>
      <text x="119" y="864" text-anchor="middle">4　V5</text><text x="244" y="864" text-anchor="middle">→ E04</text>
    </g>

    <text class="fig712-code" x="330" y="752">V1 (0)：firstedge → E01 ─ilink→ E02 ─ilink→ NULL</text>
    <text class="fig712-code" x="330" y="780">V2 (1)：firstedge → E01 ─jlink→ E03 ─ilink→ E04 ─ilink→ NULL</text>
    <text class="fig712-code" x="330" y="808">V3 (2)：firstedge → E03 ─jlink→ E05 ─ilink→ E06 ─ilink→ NULL</text>
    <text class="fig712-code" x="330" y="836">V4 (3)：firstedge → E02 ─jlink→ E05 ─jlink→ NULL</text>
    <text class="fig712-code" x="330" y="864">V5 (4)：firstedge → E04 ─jlink→ E06 ─jlink→ NULL</text>
  </g>
</svg>
