<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="t d"><title id="t">位扩展</title><desc id="d">四片 M 乘 N 位芯片共享地址与片选信号并行输出，合成 M 乘 4N 位存储器。</desc><style>text{font-family:system-ui,sans-serif;fill:#172033}.h{font-size:25px;font-weight:700}.b{font-size:16px}.chip{fill:#eef6ff;stroke:#4b8fc9;stroke-width:2}.w{stroke:#566b84;stroke-width:2;fill:none}</style><text x="450" y="35" text-anchor="middle" class="h">位扩展：字数不变，字长扩大</text><path d="M40 110H220M40 160H220" class="w"/><text x="45" y="95" class="b">共同地址线</text><text x="45" y="150" class="b">共同 CS / R/W</text><g><rect x="220" y="70" width="130" height="210" rx="12" class="chip"/><rect x="370" y="70" width="130" height="210" rx="12" class="chip"/><rect x="520" y="70" width="130" height="210" rx="12" class="chip"/><rect x="670" y="70" width="130" height="210" rx="12" class="chip"/></g><g class="b"><text x="285" y="145" text-anchor="middle">M × N</text><text x="435" y="145" text-anchor="middle">M × N</text><text x="585" y="145" text-anchor="middle">M × N</text><text x="735" y="145" text-anchor="middle">M × N</text><text x="285" y="240" text-anchor="middle">位 0…N−1</text><text x="435" y="240" text-anchor="middle">位 N…2N−1</text><text x="585" y="240" text-anchor="middle">位 2N…3N−1</text><text x="735" y="240" text-anchor="middle">位 3N…4N−1</text></g><text x="450" y="330" text-anchor="middle" class="h">合成：M × 4N bit</text></svg>
