<?xml version="1.0" encoding="UTF-8"?>
<!-- LUNA Python redraw: 实习3“文学研究助手”各模块之间的调用关系 -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">各模块之间的调用关系</title>
  <desc id="desc">主程序模块调用文本文件单元模块、有序表单元模块和单词单元模块；文本文件单元模块、有序表单元模块也调用单词单元模块。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b6a78"/>
    </marker>
  </defs>
  <rect width="1200" height="800" fill="#ffffff"/>
  <text x="600" y="58" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#20202a">各模块之间的调用关系</text>
  <g fill="none" stroke="#6b6a78" stroke-width="3" marker-end="url(#arrow)">
    <line x1="520" y1="180" x2="335" y2="326"/>
    <line x1="680" y1="180" x2="865" y2="326"/>
    <line x1="600" y1="192" x2="600" y2="530"/>
    <line x1="360" y1="370" x2="838" y2="370"/>
    <line x1="320" y1="415" x2="494" y2="545"/>
    <line x1="880" y1="415" x2="706" y2="545"/>
  </g>
  <g fill="#f7f7fa" stroke="#4d4d5c" stroke-width="3">
    <ellipse cx="600" cy="145" rx="120" ry="48"/>
    <ellipse cx="220" cy="370" rx="145" ry="58"/>
    <ellipse cx="980" cy="370" rx="145" ry="58"/>
    <ellipse cx="600" cy="590" rx="130" ry="58"/>
  </g>
  <g text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" fill="#20202a">
    <text x="600" y="154">主程序模块</text>
    <text x="220" y="361"><tspan x="220">文本文件</tspan><tspan x="220" dy="30">单元模块</tspan></text>
    <text x="980" y="361"><tspan x="980">有序表</tspan><tspan x="980" dy="30">单元模块</tspan></text>
    <text x="600" y="581"><tspan x="600">单词</tspan><tspan x="600" dy="30">单元模块</tspan></text>
  </g>
</svg>
